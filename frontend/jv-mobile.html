<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Add Journal · 390px viewport</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b1530;
        display: grid;
        place-items: start center;
        padding: 16px 0;
      }
      iframe {
        width: 390px;
        height: 820px;
        border: 0;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      #out {
        position: fixed;
        left: 8px;
        bottom: 8px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(11, 21, 48, 0.94);
        color: #d7e5ff;
        font: 500 12px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <iframe src="/jv-preview.html?account=4&fill=14078.2&picker=1&pins=2,5" title="phone"></iframe>
    <pre id="out"></pre>
    <script>
      const frame = document.querySelector('iframe');
      frame.addEventListener('load', () => {
        setTimeout(() => {
          const doc = frame.contentDocument;
          const box = (sel) => {
            const el = doc.querySelector(sel);
            if (!el) return sel + '  missing';
            const b = el.getBoundingClientRect();
            return sel + '  x=' + Math.round(b.x) + ' w=' + Math.round(b.width) + ' right=' + Math.round(b.right);
          };
          const lines = [
            'innerW=' + frame.contentWindow.innerWidth + '  scrollW=' + doc.documentElement.scrollWidth,
            box('.app-modal--full'),
            box('.journal-form-page'),
            box('.jv-body'),
            box('.jv-tabs'),
            box('.jv-grid'),
            box('.jv-grid--amount'),
            box('.jv-row--ctr'),
            box('.jv-foot')
          ];
          document.getElementById('out').textContent = lines.join('\n');
        }, 3000);
      });
    </script>
  </body>
</html>
