                      <sc-if value="{{l.actQty}}" hint-placeholder-val="{{ false }}"><input data-dr="qty" type="text" inputmode="numeric" autoFocus value="{{l.aq}}" onInput="{{l.setAq}}" onKeyDown="{{l.onActKey}}" onFocus="{{l.selOnFocus}}" dir="ltr" aria-label="مقدار" style="width: 44px; height: 100%; border: 0; outline: 0; background: var(--primary-soft); text-align: center; font: inherit; font-size: 12.5px; font-weight: 800; color: var(--ink); padding: 0; font-variant-numeric: tabular-nums"></sc-if>
                      <sc-if value="{{l.notActQty}}" hint-placeholder-val="{{ true }}"><input type="text" inputmode="numeric" value="{{l.qty}}" onChange="{{l.setQty}}" dir="ltr" aria-label="مقدار" style="width: 44px; height: 100%; border: 0; outline: 0; background: transparent; text-align: center; font: inherit; font-size: 12.5px; font-weight: 800; color: var(--ink); padding: 0; font-variant-numeric: tabular-nums"></sc-if>
                      <button onClick="{{l.dec}}" aria-label="کم" style="width: 22px; height: 100%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 14px">remove</span></button>
                      <span aria-hidden="true" style="width: 1px; height: 16px; background: var(--border); flex-shrink: 0"></span>
                      <button onClick="{{l.toggleUnit}}" aria-haspopup="listbox" aria-expanded="{{l.unitExpanded}}" aria-label="واحد" title="{{l.unitTitle}}" style="{{l.unitBtnStyle}}"><span>{{l.unit}}</span><span class="ms" style="font-size: 14px; color: var(--muted)">expand_more</span></button>
                    </span>
                    <sc-if value="{{l.unitOpen}}" hint-placeholder-val="{{ false }}">
                      <div role="listbox" aria-label="واحد" style="position: absolute; top: calc(100% + 4px); inset-inline-end: 0; min-width: 118px; z-index: 30; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 14px 32px -14px rgba(11,21,48,.38); padding: 3px">
                        <sc-for list="{{l.unitList}}" as="u" hint-placeholder-count="3">
                          <button role="option" aria-selected="{{u.selAria}}" onClick="{{u.pick}}" style="{{u.style}}">
                            <span style="font-weight: 800">{{u.n}}</span>
                            <span style="font-size: 9.5px; font-weight: 500; color: var(--subtle); white-space: nowrap">{{u.hint}}</span>
                            <span class="ms" style="{{u.check}}">check</span>
                          </button>
                        </sc-for>
                      </div>
                    </sc-if>
                  </span>
                </td>
                <td class="c-buy" style="padding: 0 8px; border-bottom: 1px solid var(--border-soft); text-align: end; white-space: nowrap"><span dir="ltr" style="font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums">{{l.buy}}</span> <span style="font-size: 10px; color: var(--subtle)">{{l.cur}}</span></td>
                <td style="padding: 0 8px; border-bottom: 1px solid var(--border-soft)">
                  <span style="{{l.priceBoxStyle}}">
                    <sc-if value="{{l.actPrice}}" hint-placeholder-val="{{ false }}"><input data-dr="price" type="text" inputmode="decimal" autoFocus value="{{l.ap}}" onInput="{{l.setAp}}" onKeyDown="{{l.onActKey}}" onFocus="{{l.selOnFocus}}" dir="ltr" aria-label="نرخ فروش" style="flex: 1; width: 0; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; text-align: end; font: inherit; font-size: 12.5px; font-weight: 800; color: var(--ink); padding: 0; font-variant-numeric: tabular-nums"></sc-if>
                    <sc-if value="{{l.notActPrice}}" hint-placeholder-val="{{ true }}"><input type="text" inputmode="decimal" defaultValue="{{l.price}}" onInput="{{l.setPrice}}" dir="ltr" aria-label="نرخ فروش" style="flex: 1; width: 0; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; text-align: end; font: inherit; font-size: 12.5px; font-weight: 800; color: var(--ink); padding: 0; font-variant-numeric: tabular-nums"></sc-if>
                    <span style="flex-shrink: 0; font-size: 10.5px; font-weight: 700; color: var(--muted); padding-inline-start: 4px; border-inline-start: 1px solid var(--border-soft); margin-inline-start: 4px">{{l.cur}}</span>
                  </span>
                  <span class="buy-sub" style="{{l.buySubStyle}}">{{l.buyLine}}</span>
                </td>
                <td style="padding: 0 8px; border-bottom: 1px solid var(--border-soft); text-align: end; white-space: nowrap; overflow: hidden">
                  <span style="display: inline-flex; align-items: center; gap: 3px; max-width: 100%; white-space: nowrap; vertical-align: middle"><span dir="ltr" style="font-size: 13px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis">{{l.total}}</span><span style="font-size: 10.5px; font-weight: 700; color: var(--muted)">{{l.totalCur}}</span></span>
                  <sc-if value="{{l.foreign}}" hint-placeholder-val="{{ false }}"><span style="display: block; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis">{{l.conv}}</span></sc-if>
                </td>
                <td style="padding: 0 8px; padding-inline-end: 12px; border-bottom: 1px solid var(--border-soft)">
                  <sc-if value="{{l.isAct}}" hint-placeholder-val="{{ false }}">
                    <span style="display: flex; align-items: center; justify-content: flex-end; gap: 4px">
                      <span title="{{l.actNext}}" style="display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--primary-soft); color: var(--link); font-size: 10px; font-weight: 800; white-space: nowrap"><span class="ms" style="font-size: 13px">keyboard_return</span>{{l.actStep}}</span>
                      <button onClick="{{l.remove}}" aria-label="حذف ردیف" title="حذف ردیف" class="btn" style="width: 26px; height: 26px; flex-shrink: 0; border: 0; border-radius: 7px; background: var(--danger-soft); color: var(--danger-text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 16px">delete</span></button>
                    </span>
                  </sc-if>
                  <sc-if value="{{l.notAct}}" hint-placeholder-val="{{ true }}">
                  <span class="ract" style="display: flex; align-items: center; justify-content: flex-end; gap: 2px">
                    <sc-if value="{{pharmacy}}" hint-placeholder-val="{{ true }}">
                      <button onClick="{{l.split}}" aria-label="افزودن بچ دیگر" title="افزودن بچ دیگر از همین ادویه" class="btn" style="{{l.splitStyle}}"><span class="ms" style="font-size: 16px">call_split</span></button>
                    </sc-if>
                    <button onClick="{{l.remove}}" aria-label="حذف ردیف" title="حذف ردیف" class="btn" style="width: 26px; height: 26px; border: 0; border-radius: 7px; background: var(--danger-soft); color: var(--danger-text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 16px">delete</span></button>
                  </span>
                  </sc-if>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>

      <!-- cards (mobile) -->
      <div class="cards" style="display: none; flex-direction: column; gap: 8px; padding: 0 10px 10px">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface)">
            <div style="display: flex; align-items: flex-start; gap: 8px">
              <span style="flex: 1; min-width: 0">
                <span style="display: block; font-weight: 700; color: var(--ink); line-height: 1.4">{{l.name}}</span>
                <span style="{{l.subStyle}}">{{l.sub}}</span>
                <span style="display: flex; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted)"><span class="ms" style="font-size: 12px">warehouse</span>{{l.whName}}</span>
              </span>
              <button onClick="{{l.remove}}" aria-label="حذف ردیف" class="btn" style="width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--danger-text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 18px">delete</span></button>
            </div>
            <sc-if value="{{pharmacy}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: center; gap: 8px">
                <select onChange="{{l.setBatch}}" aria-label="بچ نمبر" dir="ltr" style="flex: 1; min-width: 0; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; padding: 0 6px">
                  <sc-for list="{{l.batches}}" as="b" hint-placeholder-count="2"><option value="{{b.v}}" selected="{{b.sel}}">{{b.t}}</option></sc-for>
                </select>
                <span dir="ltr" style="{{l.expStyle}}">{{l.exp}}</span>
              </div>
            </sc-if>
            <div style="display: flex; align-items: center; gap: 8px">
              <div style="display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; height: 32px">
                <button onClick="{{l.dec}}" aria-label="کم" style="width: 30px; height: 100%; border: 0; background: var(--surface-2); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 16px">remove</span></button>
                <span dir="ltr" style="min-width: 34px; text-align: center; font-weight: 800; color: var(--ink)">{{l.qty}}</span>
                <button onClick="{{l.inc}}" aria-label="زیاد" style="width: 30px; height: 100%; border: 0; background: var(--surface-2); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 16px">add</span></button>
              </div>
              <span style="flex: 1; display: flex; align-items: center; gap: 4px; min-width: 0">
                <input type="text" inputmode="decimal" defaultValue="{{l.price}}" onInput="{{l.setPrice}}" dir="ltr" aria-label="نرخ فروش" style="{{l.priceStyle}}">
                <span style="{{l.curStyle}}">{{l.cur}}</span>
              </span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 11.5px">
              <span style="color: var(--muted)">خرید: <span dir="ltr" style="font-weight: 700; color: var(--text)">{{l.buy}}</span></span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3"><span style="display: inline-flex; align-items: center; gap: 3px"><span dir="ltr" style="font-size: 13px; font-weight: 800; color: var(--ink)">{{l.total}}</span><span style="font-size: 11px; color: var(--muted)">{{l.totalCur}}</span></span><sc-if value="{{l.foreign}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10.5px; color: var(--muted)">{{l.conv}}</span></sc-if></span>
            </div>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{noLines}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 16px; text-align: center">
          <span style="width: 44px; height: 44px; border-radius: 13px; background: var(--primary-soft); color: var(--link); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 23px">barcode_scanner</span></span>
          <span style="font-size: 13px; font-weight: 700; color: var(--ink)">هنوز {{itemWord}} اضافه نشده</span>
          <span style="font-size: 11.5px; color: var(--muted)">با نام، کد یا نمبر بچ جستجو کنید یا بارکد را اسکن کنید</span>
        </div>
      </sc-if>

      <!-- items footer: counts + clear all -->
      <sc-if value="{{hasLines}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 14px; padding: 8px 14px; background: var(--surface-2); border-top: 1px solid var(--border-soft); border-radius: 0 0 14px 14px">
          <span style="display: inline-flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted)">
            <span>اقلام <b dir="ltr" style="color: var(--ink); font-size: 12.5px; font-variant-numeric: tabular-nums">{{footItems}}</b></span>
            <span aria-hidden="true" style="width: 1px; height: 14px; background: var(--border)"></span>
            <span>واحد <b dir="ltr" style="color: var(--ink); font-size: 12.5px; font-variant-numeric: tabular-nums">{{footUnits}}</b></span>
          </span>
          <sc-if value="{{noClearAsk}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{askClear}}" class="btn" style="height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--danger-text); font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px"><span class="ms" style="font-size: 15px">delete_sweep</span>پاک کردن همه</button>
          </sc-if>
          <sc-if value="{{clearAsk}}" hint-placeholder-val="{{ false }}">
            <span role="alert" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; padding-inline-start: 10px; padding-inline-end: 4px; border-radius: 7px; background: var(--danger-soft); color: var(--danger-text); font-size: 11.5px; font-weight: 700">همه ردیف‌ها حذف شود؟
              <button onClick="{{doClear}}" style="height: 22px; padding: 0 9px; border: 0; border-radius: 5px; background: var(--danger-text); color: #FFFFFF; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer">بلی</button>
              <button onClick="{{cancelClear}}" style="height: 22px; padding: 0 9px; border: 0; border-radius: 5px; background: var(--surface); color: var(--text); font: inherit; font-size: 11px; font-weight: 700; cursor: pointer">نخیر</button>
            </span>
          </sc-if>
        </div>
      </sc-if>
    </section>

    <!-- ===== Bill summary (bottom) ===== -->
    <section aria-labelledby="sm" class="sum-grid" style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(11,21,48,.04), 0 4px 14px -8px rgba(11,21,48,.10)">
      <!-- 1. bill summary: discount · expenses · notes -->
      <div class="sum-cell" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
        <h3 id="sm" style="margin: 0; font-size: 12px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 6px"><span class="ms f" style="font-size: 15px; color: var(--link)">calculate</span>خلاصه بل</h3>
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
          <label style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--text); white-space: nowrap">تخفیف<sc-if value="{{discCalc}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 700; color: var(--ok-text)">{{discCalc}}</span></sc-if></span>
            <span style="display: flex; align-items: center; height: 28px; padding-inline-end: 3px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); box-sizing: border-box">
              <span class="ms" style="font-size: 14px; color: var(--muted); padding-inline-start: 8px">sell</span>
              <input type="text" inputmode="decimal" value="{{discStr}}" onInput="{{setDiscount}}" placeholder="0" dir="ltr" aria-label="تخفیف" style="flex: 1; width: 0; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); text-align: end; padding: 0 8px; font-variant-numeric: tabular-nums">
              <button onClick="{{toggleDisc}}" title="{{discToggleTitle}}" aria-label="{{discToggleTitle}}" style="{{discToggleStyle}}">{{discToggleText}}</button>
            </span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 10.5px; font-weight: 700; color: var(--text); white-space: nowrap">مصارف</span>
            <span style="display: flex; align-items: center; height: 28px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); box-sizing: border-box">
              <span class="ms" style="font-size: 14px; color: var(--muted); padding-inline-start: 8px">local_shipping</span>
              <input type="text" inputmode="decimal" placeholder="0" onInput="{{setExpense}}" dir="ltr" aria-label="مصارف" style="flex: 1; width: 0; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: var(--ink); text-align: end; padding: 0 8px; font-variant-numeric: tabular-nums">
              <span style="flex-shrink: 0; padding: 0 9px; font-size: 11px; font-weight: 700; color: var(--muted); border-inline-start: 1px solid var(--border-soft)">{{Bs}}</span>
            </span>
          </label>
        </div>
        <label style="display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; color: var(--text)">توضیحات<span style="font-weight: 500; color: var(--subtle)">اختیاری</span><span style="margin-inline-start: auto; font-size: 10px; font-weight: 500; color: var(--subtle)">{{pnoteLen}}</span></span>
          <span style="display: flex; align-items: flex-start; gap: 6px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); box-sizing: border-box">
            <span class="ms" style="font-size: 14px; color: var(--muted); margin-top: 1px">edit_note</span>
            <textarea rows="2" maxLength="200" placeholder="یادداشت پرداخت یا شرایط قرض…" aria-label="توضیحات" onInput="{{setPnote}}" style="flex: 1; min-width: 0; height: 36px; border: 0; outline: 0; resize: vertical; padding: 0; background: transparent; font: inherit; font-size: 11.5px; line-height: 1.55; color: var(--ink)"></textarea>
          </span>
        </label>
      </div>

      <!-- 2. total · received · account · actions -->
      <div class="sum-cell sum-pay" style="padding: 10px 12px; border-inline-start: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 8px">
        <!-- bill total: label on the right, amount on the left -->
        <div title="{{payableFull}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; padding: 6px 12px; border-radius: 9px; box-sizing: border-box; background: linear-gradient(135deg, #0B1530 0%, #1B3A8A 100%); color: #FFFFFF">
          <span style="display: flex; flex-direction: column; line-height: 1.3; min-width: 0">
            <span style="font-size: 11.5px; font-weight: 600; color: #E0EBFF; white-space: nowrap">مجموع بل:</span>
            <sc-if value="{{payableSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; color: #C9D8FF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{payableSub}}</span></sc-if>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; min-width: 0">
            <span style="display: flex; align-items: baseline; gap: 5px; white-space: nowrap"><span dir="ltr" style="font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">{{payable}}</span><span style="font-size: 11px; color: #E0EBFF">{{billCur}}</span></span>
            <sc-if value="{{payableAfn}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; color: #C9D8FF; white-space: nowrap">{{payableAfn}}</span></sc-if>
          </span>
        </div>
        <!-- received amount + its currency in one field (same pattern as «ارز و نرخ» in the details card) -->
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: -4px; font-size: 10.5px; font-weight: 700; color: var(--text); white-space: nowrap">رسید پول<sc-if value="{{payRate}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 500; color: var(--subtle)">{{payRate}}</span></sc-if></span>
        <div style="display: flex; align-items: center; gap: 6px">
          <div style="position: relative; flex: 1; min-width: 0">
            <span style="{{paidBoxStyle}}">
              <input type="text" inputmode="decimal" value="{{paidStr}}" onChange="{{setPaid}}" dir="ltr" aria-label="رسید پول" style="flex: 1; width: 0; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 13.5px; font-weight: 800; color: var(--ink); text-align: end; padding: 0 8px; font-variant-numeric: tabular-nums">
              <span aria-hidden="true" style="width: 1px; height: 16px; background: var(--border); flex-shrink: 0"></span>
              <button onClick="{{togglePayCur}}" aria-haspopup="listbox" aria-expanded="{{payCurExpanded}}" aria-label="ارز دریافت" title="{{payCurName}}" style="height: 100%; display: flex; align-items: center; gap: 1px; padding: 0 4px 0 6px; padding-inline-start: 7px; padding-inline-end: 3px; border: 0; background: transparent; font: inherit; font-size: 11.5px; font-weight: 700; color: var(--ink); cursor: pointer; white-space: nowrap"><span style="font-family: Inter, sans-serif; font-size: 12.5px; font-weight: 800; color: var(--link)">{{payCurSym}}</span><span class="ms" style="font-size: 14px; color: var(--muted)">expand_more</span></button>
            </span>
            <sc-if value="{{payCurOpen}}" hint-placeholder-val="{{ false }}">
              <div role="listbox" aria-label="ارز دریافت" style="position: absolute; top: calc(100% + 4px); inset-inline-end: 0; width: 200px; z-index: 28; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 14px 32px -14px rgba(11,21,48,.38); padding: 3px">
                <sc-for list="{{payCurList}}" as="c" hint-placeholder-count="4">
                  <button role="option" onClick="{{c.pick}}" style="{{c.style}}"><span style="{{c.chip}}">{{c.s}}</span><span style="flex: 1">{{c.n}}</span><span style="font-size: 10px; color: var(--muted); font-weight: 500">{{c.rate}}</span><span class="ms" style="{{c.check}}">check</span></button>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <button onClick="{{payFull}}" title="{{payInP}}" class="btn" style="height: 30px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--primary-soft); color: var(--link); font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap">کامل</button>
        </div>
        <!-- account: treasury by default; the button opens the accounts window -->
        <div style="display: flex; align-items: center; gap: 6px">
          <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-soft); box-sizing: border-box">
            <span class="ms" style="font-size: 15px; color: var(--muted)">{{accIcon}}</span>
            <span style="flex: 1; min-width: 0; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{accName2}}</span>
            <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--muted); white-space: nowrap"><span dir="ltr">{{accBal2}}</span><span>{{payCurSym}}</span></span>
          </span>
          <button onClick="{{openAccModal}}" aria-haspopup="dialog" title="حساب دریافت پول (خزانه، بانک، صرافی)" aria-label="انتخاب حساب" class="btn" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; background: var(--primary-soft); color: var(--link); border: 1px solid var(--border-strong)"><span class="ms" style="font-size: 17px">account_balance_wallet</span></button>
        </div>
        <sc-if value="{{remShow}}" hint-placeholder-val="{{ false }}">
          <div style="{{remBox}}"><span class="ms f" style="font-size: 15px">{{remIcon}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35"><span style="font-weight: 700">{{remTitle}}</span><span style="font-size: 10.5px; opacity: .9">{{remNote}}</span></span></div>
        </sc-if>
        <div class="sum-actions" style="display: flex; gap: 8px">
          <button onClick="{{saveDraft}}" aria-label="ذخیره پیش‌نویس" title="ذخیره پیش‌نویس" class="btn" style="height: 36px; padding: 0 12px 0 14px; padding-inline-start: 6px; padding-inline-end: 14px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--primary-soft); color: var(--link); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap"><span style="width: 24px; height: 24px; border-radius: 7px; background: var(--surface); box-shadow: 0 1px 2px rgba(11,21,48,.10); display: flex; align-items: center; justify-content: center"><span class="ms f" style="font-size: 16px">bookmark</span></span>پیش‌نویس</button>
          <button onClick="{{askConfirm}}" disabled="{{cantConfirm}}" class="btnp" style="{{confirmStyle}}"><span class="ms" style="font-size: 19px">check_circle</span>تایید فروش<kbd class="hide-sm" style="font: inherit; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,.18)">F9</kbd></button>
        </div>
        <span style="display: flex; align-items: flex-start; gap: 5px; font-size: 10.5px; color: var(--muted); line-height: 1.5"><span class="ms" style="font-size: 14px; margin-top: 1px">lock</span>بعد از تایید، بل حذف نمی‌شود؛ اصلاح فقط از راه برگشت فروش.</span>
      </div>
    </section>
  </div>
  </div>

  <!-- Mobile action bar -->

<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { notifOpen: false, nTab: 'all', allRead: false, dark: !!this.props.dark, profOpen: false, rwRange: 'today', whRange: 'week', whHidden: {}, mobileOpen: false, collapsed: false, reportsOpen: false, att: 'stock', range: 'week', hidden: {}, editRates: false, tx: 'all' };
  }
  renderVals() {
    const s = this.state;
    const fmt = (n) => Math.round(n).toLocaleString('en-US');

    const pts = (a, w, h, pad) => {
      const max = Math.max(...a), min = Math.min(...a), r = (max - min) || 1;
      return a.map((v, i) => (i / (a.length - 1) * w).toFixed(1) + ',' + (pad + (h - 2 * pad) * (1 - (v - min) / r)).toFixed(1)).join(' ');
    };
    const W = {
      sales: [6200, 3100, 7400, 8100, 6900, 9050, 7940],
      buy: [4800, 0, 5200, 3900, 6100, 4300, 5060],
      exp: [350, 0, 420, 180, 600, 250, 0],
      profit: [980, 410, 1150, 1320, 1010, 1460, 1249]
    };
    const spark = { sales: pts(W.sales, 120, 36, 4), buy: pts(W.buy, 120, 36, 4), exp: pts(W.exp, 120, 36, 4), profit: pts(W.profit, 120, 36, 4) };

    const M = {
      sales: [41200, 45800, 39900, 48600],
      buy: [30100, 33500, 28700, 34900],
      exp: [2100, 1900, 2600, 2300],
      profit: [6800, 7400, 6100, 8200]
    };
    const D = s.range === 'week' ? W : M;
    const xlabels = s.range === 'week'
      ? ['پنج‌شنبه', 'جمعه', 'شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'امروز']
      : ['هفته 1', 'هفته 2', 'هفته 3', 'هفته 4'];
    const keys = ['sales', 'buy', 'profit', 'exp'];
    const visible = keys.filter((k) => !s.hidden[k]);
    const rawMax = Math.max(1, ...visible.flatMap((k) => D[k]));
    const mag = Math.pow(10, Math.floor(Math.log10(rawMax)));
    const nice = Math.ceil(rawMax / mag) * mag;
    const CH = 250, CW = 700, TOP = 10;
    const line = (a) => a.map((v, i) => (i / (a.length - 1) * CW).toFixed(1) + ',' + (TOP + (CH - TOP) * (1 - v / nice)).toFixed(1)).join(' ');
    const lines = { sales: line(D.sales), buy: line(D.buy), profit: line(D.profit), exp: line(D.exp) };
    const area = '0,' + CH + ' ' + lines.sales + ' ' + CW + ',' + CH;
    const short = (n) => n >= 1000 ? (n / 1000) + 'k' : String(n);
    const ticks = [1, 0.75, 0.5, 0.25, 0].map((f) => ({
      label: short(nice * f),
      style: 'position: absolute; left: 0; right: 0; height: 0; display: flex; align-items: center; gap: 6px; top: ' + ((TOP + (CH - TOP) * (1 - f)) / CH * 100).toFixed(2) + '%'
    }));
    const svgBase = 'position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; ';
    const vis = {};
    keys.forEach((k) => { vis[k] = svgBase + (s.hidden[k] ? 'display: none' : ''); });
    const COL = { sales: 'var(--link)', buy: '#64748B', profit: '#16A34A', exp: '#D97706' };
    const NAME = { sales: 'فروش', buy: 'خرید', profit: 'مفاد', exp: 'مصرف' };
    const legend = keys.map((k) => {
      const off = !!s.hidden[k];
      return {
        label: NAME[k], pressed: off ? 'false' : 'true',
        toggle: () => this.setState({ hidden: Object.assign({}, s.hidden, { [k]: !off }) }),
        dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + (off ? 'var(--disabled)' : COL[k]),
        style: 'display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid ' + (off ? 'var(--border)' : 'var(--border-strong)') + '; background: ' + (off ? 'var(--surface)' : 'var(--hover-bg)') + '; color: ' + (off ? '#94A3B8' : '#0B1530')
      };
    });
    const totals = keys.map((k) => ({
      label: NAME[k] + (s.range === 'week' ? ' (7 روز)' : s.range === 'month' ? ' (ماه)' : ' (بازه)'),
      value: fmt(D[k].reduce((a, b) => a + b, 0)),
      dot: 'width: 7px; height: 7px; border-radius: 50%; background: ' + COL[k]
    }));
    const seg = (on) => 'height: 28px; padding: 0 11px; border: 0; border-radius: 7px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; ' + (on ? 'background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15,23,42,.12)' : 'background: transparent; color: var(--muted)');
    // ---- custom date range (one per chart) ----
    const CP = s.cp || {};
    const setCP = (k, patch, extra) => this.setState(Object.assign({ cp: Object.assign({}, CP, { [k]: Object.assign({}, CP[k] || {}, patch) }) }, extra || {}));
    const PRESETS = [['yday', 'دیروز'], ['d30', '30 روز'], ['m3', '3 ماه'], ['year', 'امسال']];
    const mkCP = (k, rangeKey, fallback) => {
      const c = CP[k] || {};
      return {
        open: !!c.open, from: c.from || '', to: c.to || '', label: c.label || '',
        showChip: !c.open && s[rangeKey] === 'custom' && !!c.label,
        presets: PRESETS.map(([id, label]) => ({
