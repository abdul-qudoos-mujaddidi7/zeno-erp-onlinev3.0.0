.sb-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sb-meta-t{display:flex;align-items:center;gap:8px}
.sb-docl{font-weight:700;color:#55617E}
.sb-meta-g{display:grid;grid-template-columns:repeat(4,auto);gap:4px 16px}
.sb-meta-g>span{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.sb-meta-g i{font-style:normal;font-size:.78em;color:#8A96B8}
.sb-meta-g b{font-weight:800;color:var(--brd)}
.sb-custline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px;padding:2px 2px 0}
.sb-custline>span{display:inline-flex;align-items:baseline;gap:6px;min-width:0}
.sb-custline i{font-style:normal;color:#8A96B8;font-size:.85em}
.sb-custline i::after{content:":"}
.sb-custline b{font-weight:800;color:var(--brd)}
.sb-ca{flex:1;min-width:0}.sb-ca b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot{display:grid;grid-template-columns:1fr minmax(220px,.9fr);gap:16px;align-items:start}
.sb-side{display:flex;flex-direction:column;gap:12px}
.sb-tot{display:flex;flex-direction:column;border:1px solid #D5DCE8;border-radius:10px;overflow:hidden}
.sb-tot>div,.sb-tot>sc-if>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 14px;border-bottom:1px dashed #E2E7F0}
.sb-tot>sc-if{display:contents}
.sb-tot span{color:#55617E;white-space:nowrap}.sb-tot span i{font-style:normal;color:#8A96B8;margin-inline-start:4px}
.sb-tot b{font-weight:800;color:var(--brd);font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.sb-tot .sb-pay{background:var(--brd);border-bottom:0;padding-block:9px}
.sb-tot .sb-pay span{color:#C9D4EE;font-weight:700}.sb-tot .sb-pay b{color:#fff;font-size:1.25em}
.sb-bal em{font-style:normal;font-size:.75em;font-weight:800;padding:1px 6px;border-radius:999px;background:#EEF1F6;color:#475569;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-bal[data-k=owe] b{color:#C81E1E}.sb-bal[data-k=owe] em{background:#FDECEC;color:#C81E1E}
.sb-bal[data-k=cr] b{color:#15803D}.sb-bal[data-k=cr] em{background:#E4F5EA;color:#15803D}
.sb-bal-now{background:#F7F9FC;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sb-bal-now b{font-size:1.1em}
.sb-unit{padding:5px 14px;font-size:.78em;color:#8A96B8;text-align:left;border-bottom:0!important}
.sb .sb-words{flex-direction:column;align-items:flex-start;gap:2px}
.sb-notes{min-height:56px}
/* A3: roomier */
.sp-sheet.sb[data-f=a3] .sb-ir{padding-block:7px!important}
.sp-sheet.sb[data-f=a3] .sb-hd::after{width:160px}
/* 80mm roll */
.sp-sheet.sb[data-f=roll]::before{height:4px}
.sp-sheet.sb[data-f=roll] .sb-hd{flex-direction:column;align-items:center;text-align:center;gap:10px}
.sp-sheet.sb[data-f=roll] .sb-hd::after{inset-inline-start:50%;transform:translateX(50%);width:90px}
.sp-sheet.sb[data-f=roll] .gs-co{flex-direction:column;align-items:center}
.sp-sheet.sb[data-f=roll] .gs-co-t{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-meta{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-meta-t{flex-wrap:wrap;justify-content:center}
.sp-sheet.sb[data-f=roll] .sb-meta-g{grid-template-columns:repeat(2,auto)}
.sp-sheet.sb[data-f=roll] .sb-meta-g>span{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-custline{flex-direction:column;gap:2px}
.sp-sheet.sb[data-f=roll] .sb-ca b{white-space:normal}
.sp-sheet.sb[data-f=roll] .sb-foot{grid-template-columns:1fr}
.sp-sheet.sb[data-f=roll] .sb-tot{order:-1}
.sp-sheet.sb[data-f=roll] .sb-tot>div,.sp-sheet.sb[data-f=roll] .sb-tot>sc-if>div{padding:5px 8px}
.sp-sheet.sb[data-f=roll] .sb-2 span{white-space:normal}
@container (max-width:520px){.sb-foot{grid-template-columns:1fr}.sb-tot{order:-1}}
.sb-tot b span{color:inherit!important}
.sb-meta-t{flex-wrap:wrap;justify-content:flex-end}
.sb-meta-t>*{white-space:nowrap}
.sb-meta-g b{white-space:nowrap}
.sb .gs-co{min-width:0;flex:1}
@container (max-width:520px){.sb-meta-g{grid-template-columns:repeat(2,auto)}.sb-meta-t .sb-chip{font-size:.72em}}

.sp-sheet.sb[data-f=a3]::after{width:110px;height:122px;top:-12px;left:-11px}
.sp-sheet.sb[data-f=roll]::after{width:52px;height:58px;top:-6px;left:-5px;opacity:.12}

.sp-sheet.sb[data-f=roll] .sb-meta{padding-inline-end:0}
.sb-tg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #D5DCE8;border-radius:10px;overflow:hidden}
.sb-tg>sc-if{display:contents}
.sb-tg>div,.sb-tg>sc-if>div{display:flex;flex-direction:column;gap:1px;padding:6px 10px;min-width:0;border-inline-start:1px solid #E6EAF1;border-top:1px solid #E6EAF1}
.sb-tg>div:nth-child(-n+4){border-top:0}
.sb-tg>div:nth-child(4n+1){border-inline-start:0}
.sb-tg span{font-size:.78em;color:#8A96B8;white-space:nowrap;display:flex;align-items:center;gap:4px}
.sb-tg span i{font-style:normal}
.sb-tg b{font-weight:800;color:var(--brd);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:1.02em;text-align:right}
.sb-tg-pay{grid-column:span 2;background:var(--brd);border-inline-start:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.sb-tg-bal em{font-style:normal;font-size:.9em;font-weight:800;padding:0 5px;border-radius:999px;background:#EEF1F6;color:#475569;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-tg-bal[data-k=owe] b{color:#C81E1E!important}.sb-tg-bal[data-k=owe] em{background:#FDECEC;color:#C81E1E}
.sb-tg-bal[data-k=cr] b{color:#15803D!important}.sb-tg-bal[data-k=cr] em{background:#E4F5EA;color:#15803D}
.sb-wn{display:flex;flex-direction:column;gap:4px;padding:0 2px}
.sb-wn>div{display:flex;gap:8px;align-items:baseline;min-width:0}
.sb-wn>div>span{font-size:.82em;color:#8A96B8;flex-shrink:0}.sb-wn>div>span::after{content:":"}
.sb-wn>div>b{font-weight:700;color:var(--brd)}
.sb-wn small{font-size:.75em;color:#A0AAC2;text-align:left}
.sp-sheet.sb[data-f=roll] .sb-tg{grid-template-columns:1fr 1fr}
.sp-sheet.sb[data-f=roll] .sb-tg>div,.sp-sheet.sb[data-f=roll] .sb-tg>sc-if>div{border-inline-start:0;border-top:1px solid #E6EAF1}

.sp-sheet.sb[data-f=roll] .sb-tg>div:nth-child(-n+2){border-top:0}

.sp-sheet.sb[data-f=a3] .sb-shape{width:230px;height:256px;left:-24px;top:-22px}
.sp-sheet.sb[data-f=roll] .sb-shape{width:96px;height:108px;left:-10px;top:-10px}
.sb-co{position:relative;display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}
.sb-logo{width:46px;height:46px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.9em;color:#0B1530;background:linear-gradient(145deg,#FFFFFF,#DCE6FF);box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.sb-co-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.sb-co-n{white-space:nowrap;font-size:1.55em;font-weight:900;letter-spacing:.2px;color:#fff;line-height:1.2}
.sb-co-s{color:#AFC0E6;font-size:.88em;font-weight:600}
.sb-co-i{display:flex;flex-wrap:wrap;gap:0 10px;color:#C9D4EE;font-size:.82em}
.sb-co-i>span+span::before{content:"·";margin-inline-end:10px;color:#6B7FB5}
.sb-doc{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;padding-inline-end:4px}
.sb-doc-l{font-size:.8em;font-weight:700;letter-spacing:1px;color:#93B4FF}
.sb-doc-n{font-size:1.9em;font-weight:900;color:#fff;line-height:1;letter-spacing:.5px;font-family:Inter,sans-serif}
.sb-doc-c{display:flex;gap:6px;margin-top:2px}
.sb-hd .sb-chip{background:rgba(255,255,255,.12)!important;color:#E6ECFA!important;border:1px solid rgba(255,255,255,.18)}
.sb-hd .sb-chip[data-s=ok]{background:rgba(34,197,94,.18)!important;color:#86EFAC!important;border-color:rgba(134,239,172,.35)}
.sb-hd .sb-chip[data-s=void]{background:rgba(248,113,113,.18)!important;color:#FCA5A5!important}
.sb-hd .sb-chip[data-s=ret],.sb-hd .sb-chip[data-s=part]{background:rgba(251,191,36,.16)!important;color:#FCD34D!important}
.sb-mrow{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:-4px;padding:8px 0;border-bottom:1px solid #E6EAF1}
.sb-mrow>span{display:flex;flex-direction:column;flex:1;min-width:0;padding-inline:10px;border-inline-start:1px solid #E6EAF1;line-height:1.3}
.sb-mrow>span:first-child{border-inline-start:0;padding-inline-start:0}
.sb-mrow i{font-style:normal;font-size:.75em;color:#8A96B8;letter-spacing:.2px}
.sb-mrow b{font-weight:800;color:#0B1530;white-space:nowrap}
/* footer */
.sb-tg{border:0!important;border-radius:12px!important;gap:1px;background:#E6EAF1;overflow:hidden}
.sb-tg>div,.sb-tg>sc-if>div{border:0!important;background:#F7F9FC;padding:7px 12px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-tg-pay{background:linear-gradient(135deg,#0B1530,#1B2D6B)!important;position:relative}
.sb-tg-pay::before{content:"";position:absolute;inset-block:8px;inset-inline-start:0;width:3px;border-radius:3px;background:#6B9BFF}
.sb-tg-bal{background:#fff!important}
.sb-wn{flex-direction:row!important;flex-wrap:wrap;align-items:baseline;gap:4px 20px!important;padding:0 2px}
.sb-wn small{margin-inline-start:auto}
/* roll */
.sp-sheet.sb[data-f=roll] .sb-hd{flex-direction:column;align-items:center;text-align:center;gap:10px}
.sp-sheet.sb[data-f=roll] .sb-co{flex-direction:column}
.sp-sheet.sb[data-f=roll] .sb-co-t{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-co-n{white-space:normal}
.sp-sheet.sb[data-f=roll] .sb-doc{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-mrow>span{flex:1 1 40%;border:0;padding:0}
.sp-sheet.sb[data-f=roll] .sb-wn{flex-direction:column!important}
@container (max-width:520px){.sb-mrow>span{flex:1 1 30%}.sb-mrow>span:nth-child(4){border-inline-start:0;padding-inline-start:0}}
.sb-mrow{display:grid!important;grid-template-columns:1.3fr .8fr .9fr .9fr 1fr;gap:0!important;font-size:.92em}
.sb-mrow>span{padding-inline:8px!important;border-inline-start:1px solid #E6EAF1!important}
.sb-mrow>span:first-child{border-inline-start:0!important;padding-inline-start:0!important}
@container (max-width:520px){.sb-mrow>span{flex:none}.sb-mrow>span:nth-child(4){border-inline-start:1px solid #E6EAF1!important;padding-inline-start:8px!important}}
.sp-sheet.sb[data-f=roll] .sb-mrow{grid-template-columns:1fr 1fr;gap:6px 0!important}
.sp-sheet.sb[data-f=roll] .sb-mrow>span{border:0!important;padding:0!important}
/* v8: info strip inside header band, ref under bill no */
.sb-hd{flex-wrap:wrap;row-gap:14px!important}
.sb-doc-r{font-size:.8em;color:#93A6D4;font-weight:600}.sb-doc-r b{color:#E6ECFA;font-weight:800;font-family:Inter,sans-serif;margin-inline-start:4px}
.sb-hstrip{position:relative;flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(2px)}
.sb-hstrip>span{display:flex;flex-direction:column;gap:1px;padding:7px 12px;min-width:0;border-inline-start:1px solid rgba(255,255,255,.12);line-height:1.25}
.sb-hstrip>span:first-child{border-inline-start:0}
.sb-hstrip i{font-style:normal;font-size:.74em;color:#93A6D4;letter-spacing:.2px}
.sb-hstrip b{font-weight:800;color:#fff;white-space:nowrap}
.sp-sheet.sb[data-f=roll] .sb-hstrip{grid-template-columns:1fr 1fr}
.sp-sheet.sb[data-f=roll] .sb-hstrip>span:nth-child(3){border-inline-start:0}
.sp-sheet.sb[data-f=roll] .sb-hstrip>span:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}
/* v9: classic invoice totals — label right, value left, one column */
.sb-end{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,44%);gap:24px;align-items:start;padding-top:4px}
.sb-end-side{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.sb-end-f{display:flex;flex-direction:column;gap:2px}
.sb-end-f span{font-size:.78em;color:#8A96B8}
.sb-end-f b{font-weight:700;color:#0B1530;line-height:1.5}
.sb-end-tot{display:flex;flex-direction:column}
.sb-end-tot>sc-if{display:contents}
.sb-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 2px}
.sb-r>span{color:#55617E;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sb-r>span i{font-style:normal;font-size:.85em;color:#8A96B8}
.sb-r>b{font-weight:700;color:#0B1530;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-r-pay{margin:4px 0;padding:8px 12px;border-radius:8px;background:#0B1530;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-r-pay>span{color:#C9D4EE;font-weight:700}
.sb-r-pay>b{color:#fff;font-size:1.3em;font-weight:900}
.sb-r-sep{margin-top:4px;padding-top:8px;border-top:1px solid #E2E7F0}
.sb-r-bal em{font-style:normal;font-size:.78em;font-weight:800;padding:0 6px;border-radius:999px;background:#EEF1F6;color:#475569;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-r-bal[data-k=owe]>b{color:#C81E1E}.sb-r-bal[data-k=owe] em{background:#FDECEC;color:#C81E1E}
.sb-r-bal[data-k=cr]>b{color:#15803D}.sb-r-bal[data-k=cr] em{background:#E4F5EA;color:#15803D}
.sb-r-now>span{color:#0B1530;font-weight:800}.sb-r-now>b{font-weight:900;font-size:1.12em}
.sb-r-u{font-size:.72em;color:#A0AAC2;text-align:left;padding:4px 2px 0}
.sp-sheet.sb[data-f=a3] .sb-r{padding-block:6px}
.sp-sheet.sb[data-f=roll] .sb-end{grid-template-columns:1fr;gap:10px}
.sp-sheet.sb[data-f=roll] .sb-end-tot{order:-1}
.sp-sheet.sb[data-f=roll] .sb-r-pay{padding:6px 8px}
@container (max-width:420px){.sb-end{grid-template-columns:1fr}.sb-end-tot{order:-1}}
@container (min-width:361px){.sb-end{grid-template-columns:minmax(0,1fr) minmax(200px,48%)!important}.sb-end-tot{order:0!important}}
/* v10: date/time + counts stacked under chips */
.sb-dm{display:flex;gap:0;margin-top:6px;border-top:1px solid rgba(255,255,255,.14);padding-top:6px}
.sb-dm>div{display:flex;flex-direction:column;gap:2px;padding-inline:12px;border-inline-start:1px solid rgba(255,255,255,.14)}
.sb-dm>div:first-child{border-inline-start:0;padding-inline-start:0}
.sb-dm>div:last-child{padding-inline-end:0}
.sb-dm span{display:flex;justify-content:space-between;align-items:baseline;gap:10px;line-height:1.35}
.sb-dm i{font-style:normal;font-size:.76em;color:#93A6D4;white-space:nowrap}
.sb-dm b{font-weight:800;color:#fff;white-space:nowrap;font-size:.92em}
.sp-sheet.sb[data-f=roll] .sb-dm{justify-content:center}
.sp-sheet.sb:not([data-f=roll]) .sb-hd{flex-wrap:nowrap!important;align-items:flex-start}
.sb .sb-co{flex:1 1 auto!important;min-width:0!important}
.sb-dm>div{padding-inline:8px}
.sb-dm span{gap:6px}
.sb-dm b{font-size:.88em}
.sb-co-i{font-size:.78em}
/* v11: compact header + attached customer strip */
.sb-hd{padding:calc(var(--pad) - 6px) var(--pad) 12px!important;gap:14px!important}
.sb-shape{width:120px!important;height:134px!important;left:-12px!important;top:-12px!important}
.sp-sheet.sb[data-f=a3] .sb-shape{width:160px!important;height:178px!important}
.sp-sheet.sb[data-f=roll] .sb-shape{width:80px!important;height:90px!important}
.sb-logo{width:36px!important;height:36px!important;border-radius:10px!important;font-size:1.45em!important}
.sb-co{gap:10px!important}
.sb-co-n{font-size:1.3em!important}

.prof-pop{position:fixed;bottom:12px;z-index:45;width:244px;padding:10px;box-sizing:border-box;background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;box-shadow:0 18px 40px -18px rgba(11,21,48,.35)}
.pm-row{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;text-align:start;box-sizing:border-box;width:100%;text-decoration:none}
.pm-row>.ms:first-child{color:var(--muted)}
.pm-row:hover{background:var(--surface);color:var(--ink)}
.pm-av{width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--text);border:2px solid var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800}
.pm-ic{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:var(--surface-3);color:var(--text);cursor:pointer;padding:0;text-decoration:none}
.pm-ic:hover{background:var(--primary-soft);color:var(--link)}
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/plain" id="dc-template">
<div dir="rtl" data-lang="fa" class="{{rootClass}} has-form" style="font-family: 'Vazirmatn', 'Noto Sans Arabic', system-ui, sans-serif; color: var(--text); background: var(--bg); height: 100vh; display: flex; overflow: hidden; font-size: 13px; line-height: 1.55">

<!-- ============ SIDEBAR (fixed) ============ -->
<aside class="{{sbClass}}" aria-label="منوی اصلی">
  <div style="display: flex; align-items: center; gap: 9px; padding: 14px 16px 10px; min-height: 56px; box-sizing: border-box">
    <div style="width: 32px; height: 32px; border-radius: 9px; background: #2F6FED; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0">Z</div>
    <div class="lbl" style="flex: 1; line-height: 1.15">
      <div style="font-weight: 800; font-size: 15px; color: #FFFFFF; letter-spacing: .6px">ZENO</div>
      <div style="font-size: 10.5px; color: #8A96B8">ERP · v3.2.6</div>
    </div>
    <button onClick="{{toggleSb}}" aria-label="جمع کردن منو" title="جمع / باز کردن منو" class="btn hide-c" style="width: 30px; height: 30px; border: 1px solid #1B2A52; background: #132042; border-radius: 8px; color: #8A96B8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
      <span class="ms" style="font-size: 18px">{{sbIcon}}</span>
    </button>
  </div>

  <div style="padding: 0 12px 4px">
    <a href="#" class="btnp" title="POS" style="display: flex; align-items: center; justify-content: center; gap: 7px; background: #2F6FED; color: #FFFFFF; border-radius: 10px; min-height: 38px; font-weight: 700; font-size: 13px; box-shadow: 0 8px 18px -8px rgba(47,111,237,.9)">
      <span class="ms f" style="font-size: 19px">point_of_sale</span>
      <span class="lbl">POS</span>
    </a>
  </div>

  <nav class="scroll" style="flex: 1; overflow-y: auto; padding: 2px 12px 10px; display: flex; flex-direction: column; gap: 1px">
    <div class="sec">اصلی</div>
    <a href="Main.html" class="nav" title="داشبورد"><span class="ms">space_dashboard</span><span class="lbl">داشبورد</span></a>

    <div class="sec">تجارت</div>
    <a href="Sales.html" class="nav on" aria-current="page" title="فروش‌ها"><span class="ms">shopping_cart</span><span class="lbl">فروش‌ها</span><span class="badge" title="پیش‌نویس‌ها">2</span></a>
    <a href="Purchases.html" class="nav" title="خریدها"><span class="ms">shopping_bag</span><span class="lbl">خریدها</span><span class="badge" title="پیش‌نویس‌ها">1</span></a>
    <a href="Products.html" class="nav" title="{{prodLabel}}"><span class="ms">{{prodIcon}}</span><span class="lbl">{{prodLabel}}</span></a>

    <div class="sec">مالی</div>
    <a href="Accounts.html" class="nav" title="حساب‌ها"><span class="ms">group</span><span class="lbl">حساب‌ها</span></a>
    <a href="Journal.html" class="nav" title="روزنامچه"><span class="ms">menu_book</span><span class="lbl">روزنامچه</span></a>
    <a href="Exchange.html" class="nav" title="صرافی"><span class="ms">currency_exchange</span><span class="lbl">صرافی</span></a>

    <div class="sec">مدیریت</div>
    <button class="nav" onClick="{{toggleReports}}" aria-expanded="{{reportsExpanded}}" title="گزارشات">
      <span class="ms">bar_chart_4_bars</span><span class="lbl" style="flex: 1">گزارشات</span>
      <span class="ms hide-c" style="{{reportsChevron}}">expand_more</span>
    </button>
    <sc-if value="{{reportsOpen}}" hint-placeholder-val="{{ false }}">
      <div class="hide-c" style="display: flex; flex-direction: column; padding: 2px 0 4px">
        <a href="SalesReport.html" class="sub">گزارش فروش</a>
        <a href="PurchaseReport.html" class="sub">گزارش خرید</a>
        <a href="ProfitLoss.html" class="sub">مفاد و زیان</a>
        <a href="StockReport.html" class="sub">گزارش موجودی</a>
      </div>
    </sc-if>
    <a href="Settings.html" class="nav" title="تنظیمات"><span class="ms">settings</span><span class="lbl">تنظیمات</span></a>
  </nav>

  <div style="position: relative; padding: 6px 12px 10px; border-top: 1px solid #1B2A52">
    <button type="button" class="nav prof-btn" onClick="{{toggleProf}}" aria-haspopup="dialog" aria-expanded="{{profExpanded}}" title="پروفایل و تنظیمات سریع" style="{{profBtnS}}">
      <span style="position: relative; width: 26px; height: 26px; border-radius: 50%; background: #2F6FED; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; flex-shrink: 0">H
        <span style="position: absolute; bottom: -1px; inset-inline-end: -1px; width: 8px; height: 8px; border-radius: 50%; background: #16A34A; border: 2px solid #0B1530"></span>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span class="prof-dot" style="position: absolute; top: -5px; inset-inline-start: -6px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #DC2626; color: #FFFFFF; font-size: 9.5px; font-weight: 700; display: none; align-items: center; justify-content: center; border: 2px solid #0B1530">{{unread}}</span></sc-if>
      </span>
      <span class="lbl" style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; text-align: start"><span style="color: #FFFFFF; font-weight: 700; font-size: 13px">hewad</span><span style="font-size: 10.5px; color: #8A96B8">مدیر سیستم</span></span>
      <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}"><span class="badge" title="اعلان‌های تازه" style="background: #DC2626">{{unread}}</span></sc-if>
      <span class="ms hide-c" style="font-size: 18px; color: #8A96B8">unfold_more</span>
    </button>
  </div>
</aside>

<!-- ============ MAIN (scrolls on its own) ============ -->
<main class="scroll" style="flex: 1; min-width: 0; height: 100vh; overflow-y: auto">

  <!-- mobile-only top row (header removed on desktop) -->
  <div class="mob-only" style="align-items: center; gap: 8px; padding: 10px 12px 0">
    <button onClick="{{openNav}}" aria-label="باز کردن منو" class="btn" style="width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 20px">menu</span></button>
    <h1 style="margin: 0; font-size: 14.5px; font-weight: 800; color: var(--ink)">فروش جدید</h1>
  </div>

  <div class="wrap" style="max-width: 1400px; margin: 0 auto; padding: 14px 20px 32px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">

  <!-- shared backdrop for every popover on the page -->
  <sc-if value="{{anyPop}}" hint-placeholder-val="{{ false }}">
    <div onClick="{{closePop}}" style="position: fixed; inset: 0; z-index: 24"></div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 12px; min-width: 0">


    <!-- ===== Sale details (compact: one row on desktop) ===== -->
    <section aria-labelledby="bi" style="background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(11,21,48,.04), 0 4px 14px -8px rgba(11,21,48,.10)">
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--border-soft)">
        <a href="Sales.html" aria-label="بازگشت به فروش‌ها" title="بازگشت به فروش‌ها" class="btn" style="width: 26px; height: 26px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 17px">{{backIcon}}</span></a>
        <span aria-hidden="true" style="width: 1px; height: 16px; background: var(--border); flex-shrink: 0"></span>
        <span class="ms f" aria-hidden="true" style="font-size: 17px; color: var(--link)">receipt_long</span>
        <h3 id="bi" style="margin: 0; font-size: 12.5px; font-weight: 800; color: var(--ink)">جزییات فروش</h3>
        <span style="margin-inline-end: auto; display: flex"><span style="{{stateChip}}">{{stateLabel}}</span></span>
        <div class="zclk zclk-sm" role="timer" aria-label="ساعت و تاریخ" title="{{clkFull}}"><span class="ms zclk-ic" aria-hidden="true">schedule</span><b dir="ltr" class="zclk-t">{{clkTime}}</b><i aria-hidden="true"></i><span class="zclk-d">{{clkDate}}</span></div>
      <div style="position: relative">
          <button onClick="{{toggleVis}}" aria-haspopup="listbox" aria-expanded="{{visExpanded}}" title="ویزیتور (اختیاری)" style="{{visBtnHeadStyle}}"><span class="ms" style="font-size: 15px">{{visIcon}}</span>{{visHead}}<span class="ms" style="font-size: 14px">expand_more</span></button>
          <sc-if value="{{visOpen}}" hint-placeholder-val="{{ false }}">
            <div role="listbox" aria-label="ویزیتور" style="position: absolute; top: calc(100% + 4px); inset-inline-end: 0; width: 190px; z-index: 26; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; box-shadow: 0 18px 40px -14px rgba(11,21,48,.35); padding: 4px; box-sizing: border-box">
              <sc-for list="{{visList}}" as="v" hint-placeholder-count="3">
                <button role="option" onClick="{{v.pick}}" style="{{v.style}}"><span>{{v.n}}</span><span class="ms" style="{{v.check}}">check</span></button>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </div>

      <div class="drow" style="display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, .9fr) minmax(0, 1.9fr) minmax(0, 1.3fr); gap: 8px; align-items: start; padding: 8px 12px 10px">

        <!-- date: default calendar in field, other one faint below -->
        <div class="d-date" style="display: flex; flex-direction: column; gap: 3px; position: relative; min-width: 0">
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--text)">تاریخ<span style="{{dateWeekStyle}}">{{dateWeek}}</span></span>
          <button onClick="{{toggleDate}}" aria-haspopup="dialog" aria-expanded="{{dateExpanded}}" title="{{dateMainNice}}" style="{{dateBtnStyle}}">
            <span class="ms" style="font-size: 15px; color: var(--link)">calendar_month</span>
            <span dir="ltr" style="flex: 1; min-width: 0; text-align: start; font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden">{{dateMain}}</span>
          </button>
          <span style="font-size: 10px; color: var(--subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-inline-start: 2px">{{dateAlt}}</span>
          <sc-if value="{{dateOpen}}" hint-placeholder-val="{{ false }}">
            <div role="dialog" aria-label="تقویم" style="position: absolute; top: 50px; inset-inline-start: 0; z-index: 26; width: 260px; padding: 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: 0 18px 40px -14px rgba(11,21,48,.35); box-sizing: border-box">
              <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 4px">
                <button onClick="{{dcal.prev}}" aria-label="قبلی" class="btn" style="width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 17px">chevron_right</span></button>
                <span style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px">
                  <button onClick="{{dcal.toggleMonths}}" aria-label="انتخاب ماه" style="{{dcal.monthBtnStyle}}">{{dcal.monthLabel}}</button>
                  <button onClick="{{dcal.toggleYears}}" aria-label="انتخاب سال" style="{{dcal.yearBtnStyle}}"><span dir="ltr">{{dcal.yearLabel}}</span></button>
                </span>
                <button onClick="{{dcal.next}}" aria-label="بعدی" class="btn" style="width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms" style="font-size: 17px">chevron_left</span></button>
              </div>
              <sc-if value="{{dcal.isDays}}" hint-placeholder-val="{{ true }}">
                <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))">
                  <sc-for list="{{dcal.wd}}" as="w" hint-placeholder-count="7"><span style="{{w.style}}">{{w.t}}</span></sc-for>
                </div>
                <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 1px">
                  <sc-for list="{{dcal.cells}}" as="c" hint-placeholder-count="35"><button onClick="{{c.pick}}" aria-label="{{c.aria}}" disabled="{{c.dis}}" style="{{c.style}}">{{c.t}}</button></sc-for>
                </div>
              </sc-if>
              <sc-if value="{{dcal.isMonths}}" hint-placeholder-val="{{ false }}">
                <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
                  <sc-for list="{{dcal.months}}" as="mm" hint-placeholder-count="12"><button onClick="{{mm.pick}}" style="{{mm.style}}">{{mm.t}}</button></sc-for>
                </div>
              </sc-if>
              <sc-if value="{{dcal.isYears}}" hint-placeholder-val="{{ false }}">
                <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
                  <sc-for list="{{dcal.years}}" as="yy" hint-placeholder-count="12"><button onClick="{{yy.pick}}" dir="ltr" style="{{yy.style}}">{{yy.t}}</button></sc-for>
                </div>
              </sc-if>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-soft)">
                <span style="display: flex; flex-direction: column; line-height: 1.3; min-width: 0"><span style="font-size: 10.5px; font-weight: 700; color: var(--text)">{{dcal.hint}}</span><span style="font-size: 10px; color: var(--subtle)">{{dcal.other}}</span></span>
                <button onClick="{{dcal.today}}" style="height: 24px; padding: 0 9px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--link); font: inherit; font-size: 11px; font-weight: 700; cursor: pointer">امروز</button>
              </div>
            </div>
          </sc-if>
        </div>

        <!-- bill number: plain field, auto by default -->
        <label style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--text); white-space: nowrap">شماره بل
            <sc-if value="{{billNoEdited}}" hint-placeholder-val="{{ false }}"><button onClick="{{resetBillNo}}" title="برگشت به شماره خودکار" style="height: 16px; padding: 0 5px; border: 0; border-radius: 4px; background: var(--warn-soft); color: var(--warn-text); font: inherit; font-size: 10px; font-weight: 700; cursor: pointer">دستی ↺</button></sc-if>
            <sc-if value="{{billNoNotEdited}}" hint-placeholder-val="{{ true }}"><span style="font-size: 10px; font-weight: 500; color: var(--subtle)">خودکار</span></sc-if>
          </span>
          <span style="display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); box-sizing: border-box">
            <span style="font-size: 12px; font-weight: 800; color: var(--subtle)">#</span>
            <input type="text" value="{{billNo}}" onInput="{{setBillNo}}" dir="ltr" aria-label="شماره بل" style="flex: 1; width: 0; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font-family: Inter, sans-serif; font-size: 12px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; text-align: start">
          </span>
        </label>

        <!-- customer -->
        <div class="d-cust" style="display: flex; flex-direction: column; gap: 3px; position: relative; min-width: 0">
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 10.5px; font-weight: 700; color: var(--text)">مشتری</span>
          <div style="{{custBoxStyle}}">
            <button onClick="{{toggleCust}}" aria-haspopup="listbox" aria-expanded="{{custExpanded}}" title="{{cust.title}}" style="flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 7px; padding: 0; padding-inline-start: 5px; padding-inline-end: 4px; border: 0; background: transparent; font: inherit; cursor: pointer; text-align: start">
              <span style="{{cust.avatar}}">{{cust.initial}}</span>
              <span style="flex: 1; min-width: 0; font-size: 11.5px; font-weight: 800; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cust.name}}</span>
              <span style="{{cust.balChipStyle}}">{{cust.balChip}}</span>
              <span class="ms" style="{{custChev}}">expand_more</span>
            </button>
            <span aria-hidden="true" style="width: 1px; height: 18px; background: var(--border); flex-shrink: 0"></span>
            <button onClick="{{openNc}}" aria-label="مشتری جدید" title="مشتری جدید" class="btn" style="width: 24px; height: 24px; flex-shrink: 0; border: 0; border-radius: 6px; background: var(--primary-soft); color: var(--link); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><span class="ms f" style="font-size: 15px">person_add</span></button>
          </div>
          <sc-if value="{{custOpen}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: calc(100% + 4px); inset-inline-start: 0; width: max(100%, 340px); z-index: 26; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 40px -14px rgba(11,21,48,.35); overflow: hidden">
              <div style="padding: 6px">
                <label style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 9px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--muted)">
                  <span class="ms" style="font-size: 17px">search</span>
                  <input type="search" autoFocus placeholder="نام یا شماره تلفن…" aria-label="جستجوی مشتری" onInput="{{onCustSearch}}" style="flex: 1; width: 0; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 11.5px; color: var(--ink)">
                </label>
              </div>
              <div role="listbox" aria-label="مشتریان" class="scroll" style="max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding: 0 6px 6px">
                <sc-for list="{{custList}}" as="c" hint-placeholder-count="4">
                  <button role="option" onClick="{{c.pick}}" title="{{c.title}}" style="{{c.style}}">
                    <span style="{{c.avatar}}">{{c.initial}}</span>
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
                      <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
                      <span style="font-size: 10.5px; color: var(--muted); font-weight: 500"><span dir="ltr">{{c.phone}}</span></span>
                    </span>
                    <span style="{{c.balStyle}}">{{c.balText}}</span>
                  </button>
                </sc-for>
                <sc-if value="{{custEmpty}}" hint-placeholder-val="{{ false }}">
                  <span style="padding: 10px; font-size: 12px; color: var(--muted); text-align: center">مشتری پیدا نشد</span>
                </sc-if>
              </div>
              <button onClick="{{openNc}}" class="row" style="width: 100%; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 0; border-top: 1px solid var(--border-soft); background: var(--surface-2); color: var(--link); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; text-align: start"><span class="ms f" style="font-size: 17px">person_add</span>{{custNewText}}</button>
            </div>
          </sc-if>
        </div>

        <!-- currency + exchange rate in one field -->
        <div class="d-cur" style="display: flex; flex-direction: column; gap: 3px; position: relative; min-width: 0">
          <span style="display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--text); white-space: nowrap">ارز و نرخ<span style="{{rateNoteStyle}}">{{rateNote}}</span></span>
          <div style="{{curBoxStyle}}">
            <button onClick="{{toggleCur}}" aria-haspopup="listbox" aria-expanded="{{curExpanded}}" title="{{curName}}" aria-label="ارز بل: {{curName}}" style="flex: 0 0 auto; min-width: 0; height: 100%; display: flex; align-items: center; gap: 4px; padding: 0; padding-inline-start: 8px; padding-inline-end: 4px; border: 0; background: transparent; font: inherit; font-size: 11.5px; font-weight: 700; color: var(--ink); cursor: pointer">
              <span style="font-family: Inter, sans-serif; font-size: 12.5px; font-weight: 800; color: var(--link); flex-shrink: 0">{{curSym}}</span>
              <span class="ms" style="font-size: 14px; color: var(--muted)">expand_more</span>
            </button>
            <span aria-hidden="true" style="width: 1px; height: 16px; background: var(--border); flex-shrink: 0"></span>
            <button onClick="{{toggleRate}}" aria-haspopup="dialog" aria-expanded="{{rateExpanded}}" title="{{rateHint}}" aria-label="ویرایش نرخ تبادله" style="flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 0 6px; border: 0; background: transparent; font: inherit; cursor: pointer">
              <span dir="ltr" style="{{rateChipStyle}}">{{rateSummary}}</span>
              <span class="ms" style="font-size: 14px; color: var(--muted)">edit</span>
            </button>
          </div>
          <sc-if value="{{curOpen}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: calc(100% + 4px); inset-inline-start: 0; width: 248px; z-index: 26; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 40px -14px rgba(11,21,48,.35); overflow: hidden">
              <div style="padding: 6px">
                <label style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-soft); color: var(--muted)">
                  <span class="ms" style="font-size: 16px">search</span>
                  <input type="search" autoFocus placeholder="جستجوی ارز…" aria-label="جستجوی ارز" onInput="{{onCurSearch}}" style="flex: 1; width: 0; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 11.5px; color: var(--ink)">
                </label>
              </div>
              <div role="listbox" aria-label="ارز بل" class="scroll" style="max-height: 220px; overflow-y: auto; padding: 0 6px 6px; display: flex; flex-direction: column; gap: 1px">
                <sc-for list="{{curList}}" as="c" hint-placeholder-count="5">
                  <button role="option" onClick="{{c.pick}}" style="{{c.style}}">
                    <span style="{{c.chip}}">{{c.s}}</span>
                    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25"><span>{{c.n}}</span><span dir="ltr" style="font-size: 10px; color: var(--muted); font-weight: 500; text-align: end">{{c.rate}}</span></span>
                    <span dir="ltr" style="font-size: 10px; font-weight: 700; color: var(--subtle)">{{c.code}}</span>
                    <span class="ms" style="{{c.check}}">check</span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{rateOpen}}" hint-placeholder-val="{{ false }}">
            <div role="dialog" aria-label="نرخ تبادله" style="position: absolute; top: calc(100% + 4px); inset-inline-end: 0; width: 236px; z-index: 26; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 40px -14px rgba(11,21,48,.35); padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--ink)">نرخ تبادله
                <sc-if value="{{hasRateTabs}}" hint-placeholder-val="{{ false }}">
                  <span style="display: flex; gap: 2px; margin-inline-start: auto"><sc-for list="{{rateTabs}}" as="t" hint-placeholder-count="2"><button onClick="{{t.pick}}" style="{{t.style}}">{{t.s}}</button></sc-for></span>
                </sc-if>
              </span>
              <div style="{{rateBoxStyle}}">
                <span dir="ltr" style="font-size: 11.5px; font-weight: 800; color: var(--ink); white-space: nowrap; flex-shrink: 0">1 {{rateSym}}</span>
                <button onClick="{{toggleOp}}" title="{{rateOpTitle}}" aria-label="{{rateOpTitle}}" style="{{rateOpStyle}}">{{rateOp}}</button>
                <input type="text" inputmode="decimal" autoFocus value="{{rateVal}}" onInput="{{setRate}}" dir="ltr" aria-label="نرخ تبادله" style="flex: 1; width: 0; min-width: 0; border: 0; outline: 0; background: transparent; font-family: Inter, sans-serif; font-size: 12.5px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; padding: 0; text-align: end">
              </div>
              <span style="display: flex; gap: 5px; font-size: 10.5px; color: var(--muted); line-height: 1.5"><span class="ms" style="font-size: 13px">info</span><span>{{rateExplain}}</span></span>
              <div style="display: flex; gap: 6px">
                <button onClick="{{rateReset}}" class="btn" style="flex: 1; height: 28px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer">نرخ امروز</button>
                <button onClick="{{closePop}}" class="btnp" style="flex: 1; height: 28px; border: 0; border-radius: 7px; background: #2F6FED; color: #FFFFFF; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer">تایید</button>
              </div>
            </div>
          </sc-if>
        </div>

        <!-- description: full width under the fields -->
        <label class="d-desc" style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; color: var(--text); white-space: nowrap">توضیحات<span style="font-weight: 500; color: var(--subtle)">اختیاری</span><span style="margin-inline-start: auto; font-size: 10px; font-weight: 500; color: var(--subtle)">{{descLen}}</span></span>
          <span style="display: flex; align-items: flex-start; gap: 6px; padding: 7px 4px 4px 9px; padding-inline-start: 9px; padding-inline-end: 4px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); box-sizing: border-box">
            <span class="ms" style="font-size: 15px; color: var(--muted); margin-top: 1px">edit_note</span>
            <textarea rows="2" maxLength="200" placeholder="یادداشت برای مشتری یا گدام…" aria-label="توضیحات" onInput="{{setDesc}}" style="flex: 1; min-width: 0; min-height: 34px; border: 0; outline: 0; resize: vertical; padding: 0; background: transparent; font: inherit; font-size: 11.5px; line-height: 1.5; color: var(--ink)"></textarea>
            <button onClick="{{togglePrint}}" title="{{printTitle}}" aria-label="{{printTitle}}" style="{{printStyle}}"><span class="ms" style="font-size: 15px">{{printIcon}}</span></button>

    </section>

    <!-- ===== Items ===== -->
    <section aria-labelledby="it" style="background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(11,21,48,.04), 0 4px 14px -8px rgba(11,21,48,.10)">
      <!-- header row: title · search (main task) · warehouse (a setting, shown as a field) · new product (an action, shown as a button) -->
      <div class="ihead" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px">
        <h3 id="it" style="margin: 0; font-size: 12.5px; font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 6px; white-space: nowrap"><span class="ms f" style="font-size: 17px; color: var(--link)">{{itemIcon}}</span>{{itemsTitle}}</h3>

        <!-- warehouse: a setting -> looks like a field with its label -->
        <div style="position: relative; flex-shrink: 0">
          <button onClick="{{toggleWh}}" aria-haspopup="listbox" aria-expanded="{{whExpanded}}" title="گدام فروش" aria-label="گدام فروش" style="{{whFieldStyle}}">
            <span class="ms" style="font-size: 17px; color: var(--link)">warehouse</span>
            <span class="wh-name" style="flex: 1; min-width: 0; max-width: 120px; font-size: 12px; font-weight: 800; color: var(--link); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: start">{{wh}}</span>
            <span class="ms" style="{{whChev}}">expand_more</span>
          </button>
          <sc-if value="{{whOpen}}" hint-placeholder-val="{{ false }}">
            <div role="listbox" aria-label="گدام" style="position: absolute; top: calc(100% + 4px); inset-inline-start: 0; width: max(100%, 160px); z-index: 28; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 14px 32px -14px rgba(11,21,48,.35); padding: 3px; box-sizing: border-box">
              <sc-for list="{{whList}}" as="w" hint-placeholder-count="3">
                <button role="option" onClick="{{w.pick}}" style="{{w.style}}"><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.n}}</span><span class="ms" style="{{w.check}}">check</span></button>
              </sc-for>
            </div>
          </sc-if>
        </div>

        <div class="sbar" style="position: relative; flex: 1 1 180px; min-width: 0">
          <div style="{{sbarStyle}}">
            <span class="ms" style="font-size: 18px; color: var(--muted)">search</span>
                      <input type="search" data-dr="search" autoFocus value="{{iqText}}" placeholder="جستجوی محصول — نام، کد، نمبر بچ یا بارکد" aria-label="جستجوی محصول" role="combobox" aria-expanded="{{suggExpanded}}" aria-autocomplete="list" onInput="{{onItemSearch}}" onKeyDown="{{onSearchKey}}" style="flex: 1; width: 0; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink); padding: 0">
                      <sc-if value="{{entryHint}}" hint-placeholder-val="{{ false }}"><span class="hide-sm" style="font-size: 10.5px; color: var(--link); background: var(--primary-soft); border-radius: 999px; padding: 1px 8px; white-space: nowrap">{{entryHint}}</span></sc-if>
                      <kbd class="hide-sm" style="font: inherit; font-size: 10px; font-weight: 700; color: var(--subtle); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface)">F2</kbd>
            <span aria-hidden="true" style="width: 1px; height: 16px; background: var(--border); flex-shrink: 0"></span>
            <button onClick="{{openQa}}" title="{{qaTitle}}" aria-label="{{qaTitle}}" class="btn add-new" style="height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 9px; padding-inline-start: 6px; flex-shrink: 0; border: 0; border-radius: 7px; background: var(--primary-soft); color: var(--link); font: inherit; font-size: 11.5px; font-weight: 800; cursor: pointer; white-space: nowrap"><span class="ms" style="font-size: 17px; font-variation-settings: 'FILL' 0, 'wght' 500">add_circle</span><span class="hide-sm">{{itemWord}} جدید</span></button>
          </div>
          <sc-if value="{{hasSugg}}" hint-placeholder-val="{{ false }}">
            <div role="listbox" aria-label="نتایج جستجو" style="position: absolute; top: calc(100% + 4px); inset-inline-start: 0; width: 360px; max-width: calc(100vw - 48px); z-index: 28; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 16px 36px -14px rgba(11,21,48,.38); padding: 3px">
              <div class="scroll" style="max-height: 152px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px">
                <sc-for list="{{sugg}}" as="g" hint-placeholder-count="4">
                  <button role="option" aria-selected="{{g.selAria}}" aria-disabled="{{g.dis}}" onClick="{{g.add}}" onMouseEnter="{{g.hover}}" title="{{g.name}}" style="{{g.rowStyle}}">
                    <span style="{{g.nameStyle}}">{{g.name}}</span>
                    <span style="flex-shrink: 0; height: 16px; padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--muted); font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap">{{g.cat}}</span>
                    <span style="{{g.qtyStyle}}">{{g.qtyText}}</span>
                  </button>
                </sc-for>
              </div>
              <div style="display: flex; align-items: center; gap: 8px; height: 20px; padding: 0 7px; border-top: 1px solid var(--border-soft); font-size: 9.5px; color: var(--subtle)">
                <span>↑↓ انتخاب · Enter افزودن · Esc بستن</span><span style="margin-inline-start: auto">{{suggCount}}</span>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{noSugg}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: calc(100% + 4px); inset-inline-start: 0; width: 360px; z-index: 28; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px 0 10px; padding-inline-start: 10px; padding-inline-end: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 16px 36px -14px rgba(11,21,48,.38); box-sizing: border-box">
              <span class="ms" style="font-size: 16px; color: var(--subtle)">search_off</span>
              <span style="flex: 1; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">«{{iqText}}» پیدا نشد</span>
              <button onClick="{{openQa}}" class="btn" style="height: 24px; padding: 0 8px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); color: var(--link); font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 3px; white-space: nowrap"><span class="ms" style="font-size: 14px">add</span>ثبت جدید</button>
            </div>
          </sc-if>
        </div>

      </div>

      <!-- table (desktop / tablet) -->
      <div class="tbl-wrap scroll" style="{{tblWrapStyle}}">
        <table class="{{tblClass}}" style="width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 12px; text-align: start">
          <thead>
            <tr style="color: var(--muted); font-size: 10.5px; letter-spacing: .1px">
              <th class="c-n i-n" style="position: sticky; top: 0; z-index: 2; font-weight: 700; height: 30px; padding: 0; padding-inline-start: 8px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); text-align: start">#</th>
              <th class="c-name" style="position: sticky; top: 0; z-index: 2; font-weight: 700; padding: 0 8px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); text-align: start">{{itemWord}}</th>
              <th class="i-b" style="{{phTh}}">بچ</th>
              <th class="i-e t-exp" style="{{phTh}}">انقضاء</th>
              <th class="i-q" style="position: sticky; top: 0; z-index: 2; font-weight: 700; padding: 0 8px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); text-align: start">مقدار</th>
              <th class="c-buy i-buy" style="position: sticky; top: 0; z-index: 2; font-weight: 700; padding: 0 8px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); text-align: end">
                <button onClick="{{toggleBuy}}" title="{{buyEyeTitle}}" aria-label="{{buyEyeTitle}}" style="display: inline-flex; align-items: center; gap: 3px; border: 0; background: transparent; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; padding: 0">نرخ خرید<span class="ms" style="font-size: 13px">{{buyEye}}</span></button>
              </th>
              <th class="i-sell" style="position: sticky; top: 0; z-index: 2; font-weight: 700; padding: 0 8px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); text-align: end">نرخ فروش</th>
              <th class="i-tot" style="position: sticky; top: 0; z-index: 2; font-weight: 700; padding: 0 8px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); text-align: end">مجموع</th>
              <th class="i-act" style="position: sticky; top: 0; z-index: 2; font-weight: 700; padding: 0 8px; padding-inline-end: 12px; background: var(--surface-2); border-bottom: 1px solid var(--border-soft); text-align: end"><span class="sr">اقدامات</span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
              <tr class="srow" style="{{l.rowStyle}}">
                <td class="c-n" style="height: 48px; padding: 0; padding-inline-start: 8px; border-bottom: 1px solid var(--border-soft)"><span style="font-size: 9.5px; font-weight: 700; color: var(--subtle); font-variant-numeric: tabular-nums">{{l.i}}</span></td>
                <td class="c-name" style="padding: 6px 8px; border-bottom: 1px solid var(--border-soft); min-width: 0" title="{{l.rowTitle}}">
                  <span style="display: block; color: var(--ink); font-weight: 700; font-size: 12.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.name}}</span>
                  <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 2px; font-size: 10.5px; color: var(--muted)"><span dir="ltr">{{l.code}}</span><span style="display: inline-flex; align-items: center; gap: 2px; white-space: nowrap"><span class="ms" style="font-size: 12px">warehouse</span>{{l.whName}}</span><span style="{{l.stockStyle}}">{{l.stockText}}</span></span>
                </td>
                <td style="{{phTd}}">

                      <button data-dr="batch" autoFocus onKeyDown="{{l.onActBatchKey}}" aria-haspopup="listbox" aria-expanded="true" dir="ltr" style="width: 100%; height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 7px; background: var(--surface); border: 1.5px solid #2F6FED; box-shadow: 0 0 0 3px rgba(47,111,237,.14); font: inherit; font-size: 11.5px; font-weight: 800; color: var(--ink); cursor: pointer; box-sizing: border-box; outline: 0"><span style="flex: 1; text-align: start">{{l.actBatchLabel}}</span><span class="ms" style="font-size: 15px; color: var(--link)">expand_less</span></button>

                        <span style="display: block; padding: 2px 6px 4px; font-size: 10px; font-weight: 700; color: var(--muted)">↑ ↓ انتخاب بچ · Enter تایید</span>
                        <sc-for list="{{l.actBatchList}}" as="b" hint-placeholder-count="2">
                          <button role="option" aria-selected="{{b.selAria}}" aria-disabled="{{b.disAria}}" onClick="{{b.pick}}" onMouseEnter="{{b.hover}}" style="{{b.style}}">
                            <span dir="ltr" style="min-width: 60px">{{b.v}}</span><span dir="ltr" style="{{b.expStyle}}">{{b.exp}}</span><span style="font-size: 10px; font-weight: 600; color: var(--muted)">{{b.stock}}</span><span class="ms" style="{{b.check}}">check</span>
                          </button>
                        </sc-for>
                      </div>
                    </div>
                  </sc-if>
                  <sc-if value="{{l.notActBatch}}" hint-placeholder-val="{{ true }}">
                  <select onChange="{{l.setBatch}}" aria-label="بچ" dir="ltr" style="width: 100%; height: 28px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--ink); font: inherit; font-size: 11.5px; font-weight: 700; padding: 0 4px; cursor: pointer">
                    <sc-for list="{{l.batches}}" as="b" hint-placeholder-count="2"><option value="{{b.v}}" selected="{{b.sel}}">{{b.t}}</option></sc-for>
                  </select>
                  </sc-if>
                </td>
                <td class="t-exp" style="{{phTd}}">
                  <span dir="ltr" title="{{l.expTitle}}" style="{{l.expStyle}}">{{l.exp}}</span>
                  <span style="{{l.expLeftStyle}}">{{l.expLeft}}</span>
                </td>
                <td style="padding: 0 8px; border-bottom: 1px solid var(--border-soft); text-align: start">
                  <!-- quantity + unit in one field: number on the right, unit on the left -->

                    <span style="{{l.qtyBoxStyle}}">
