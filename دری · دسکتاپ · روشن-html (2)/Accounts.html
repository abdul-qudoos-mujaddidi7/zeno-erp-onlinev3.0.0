@media (max-width:767px){.np-grid{grid-template-columns:minmax(0,1fr)!important}.np-grid>*{grid-column:auto!important}.np-side{grid-template-columns:minmax(0,1fr)!important}.np-page{padding:10px 12px 0!important}.np-bar{margin:0 -12px!important;padding:8px 12px calc(8px + env(safe-area-inset-bottom))!important}.np-st,.np-cancel{display:none!important}.np-bar .btn,.np-bar .btnp{flex:1}.np-toast{bottom:70px!important}}
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<div id="dc-root"></div>
<script type="text/plain" id="dc-template">
<div dir="rtl" data-lang="fa" class="{{rootClass}}" style="font-family: 'Vazirmatn', 'Noto Sans Arabic', system-ui, sans-serif; color: var(--text); background: var(--bg); height: 100vh; display: flex; overflow: hidden; font-size: 13px; line-height: 1.55">

<!-- ============ SIDEBAR (fixed) ============ -->
<aside class="{{sbClass}}" aria-label="منوی اصلی">
  <div style="display: flex; align-items: center; gap: 9px; padding: 14px 16px 10px; min-height: 56px; box-sizing: border-box">
    <div style="width: 32px; height: 32px; border-radius: 9px; background: #2F6FED; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0">Z</div>
    <div class="lbl" style="flex: 1; line-height: 1.15">
      <div style="font-weight: 800; font-size: 15px; color: #FFFFFF; letter-spacing: .6px">ZENO</div>
      <div style="font-size: 10.5px; color: #8A96B8">ERP · v3.2.6</div>
    </div>
    <button onClick="{{toggleSb}}" aria-label="جمع کردن منو" title="جمع / باز کردن منو" class="btn hide-c" style="width: 30px; height: 30px; border: 1px solid #1B2A52; background: #132042; border-radius: 8px; color: #8A96B8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
      <span class="ms" style="font-size: 18px">{{sbIcon}}</span>
    </button>
  </div>

  <div style="padding: 0 12px 4px">
    <a href="#" class="btnp" title="POS" style="display: flex; align-items: center; justify-content: center; gap: 7px; background: #2F6FED; color: #FFFFFF; border-radius: 10px; min-height: 38px; font-weight: 700; font-size: 13px; box-shadow: 0 8px 18px -8px rgba(47,111,237,.9)">
      <span class="ms f" style="font-size: 19px">point_of_sale</span>
      <span class="lbl">POS</span>
    </a>
  </div>

  <nav class="scroll" style="flex: 1; overflow-y: auto; padding: 2px 12px 10px; display: flex; flex-direction: column; gap: 1px">
    <div class="sec">اصلی</div>
    <a href="Main.html" class="nav" title="داشبورد"><span class="ms">space_dashboard</span><span class="lbl">داشبورد</span></a>

    <div class="sec">تجارت</div>
    <a href="Sales.html" class="nav" title="فروش‌ها"><span class="ms">shopping_cart</span><span class="lbl">فروش‌ها</span><span class="badge" title="پیش‌نویس‌ها">2</span></a>
    <a href="Purchases.html" class="nav" title="خریدها"><span class="ms">shopping_bag</span><span class="lbl">خریدها</span><span class="badge" title="پیش‌نویس‌ها">1</span></a>
    <a href="Products.html" class="nav" title="{{prodLabel}}"><span class="ms">{{prodIcon}}</span><span class="lbl">{{prodLabel}}</span></a>

    <div class="sec">مالی</div>
    <a href="Accounts.html" class="nav on" aria-current="page" title="حساب‌ها"><span class="ms">group</span><span class="lbl">حساب‌ها</span></a>
    <a href="Journal.html" class="nav" title="روزنامچه"><span class="ms">menu_book</span><span class="lbl">روزنامچه</span></a>
    <a href="Exchange.html" class="nav" title="صرافی"><span class="ms">currency_exchange</span><span class="lbl">صرافی</span></a>

    <div class="sec">مدیریت</div>
    <button class="nav" onClick="{{toggleReports}}" aria-expanded="{{reportsExpanded}}" title="گزارشات">
      <span class="ms">bar_chart_4_bars</span><span class="lbl" style="flex: 1">گزارشات</span>
      <span class="ms hide-c" style="{{reportsChevron}}">expand_more</span>
    </button>
    <sc-if value="{{reportsOpen}}" hint-placeholder-val="{{ false }}">
      <div class="hide-c" style="display: flex; flex-direction: column; padding: 2px 0 4px">
        <a href="SalesReport.html" class="sub">گزارش فروش</a>
        <a href="PurchaseReport.html" class="sub">گزارش خرید</a>
        <a href="ProfitLoss.html" class="sub">مفاد و زیان</a>
        <a href="StockReport.html" class="sub">گزارش موجودی</a>
      </div>
    </sc-if>
    <a href="Settings.html" class="nav" title="تنظیمات"><span class="ms">settings</span><span class="lbl">تنظیمات</span></a>
  </nav>

  <div style="padding: 10px 12px 12px; border-top: 1px solid #1B2A52">
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: #132042">
      <div style="position: relative; width: 32px; height: 32px; border-radius: 50%; background: #2F6FED; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0">H
        <span style="position: absolute; bottom: 0; inset-inline-end: 0; width: 9px; height: 9px; border-radius: 50%; background: #16A34A; border: 2px solid #132042"></span></div>
      <div class="lbl" style="flex: 1; line-height: 1.3; min-width: 0">
        <div style="color: #FFFFFF; font-weight: 700; font-size: 13px">hewad</div>
        <div style="font-size: 11px; color: #8A96B8">مدیر سیستم</div>
      </div>
      <button aria-label="خروج" title="خروج" class="btn hide-c" style="width: 30px; height: 30px; border: 0; background: transparent; border-radius: 8px; color: #8A96B8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
        <span class="ms" style="font-size: 18px">logout</span>
      </button>
    </div>
  </div>
</aside>

<!-- ============ MAIN (scrolls on its own) ============ -->
<main class="scroll" style="flex: 1; min-width: 0; height: 100vh; overflow-y: auto">

  <!-- Compact sticky header -->
  <header style="position: sticky; top: 0; z-index: 5; background: var(--header-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border)">
    <div class="hdr" style="max-width: 1400px; margin: 0 auto; padding: 8px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 52px; box-sizing: border-box">
      <button onClick="{{openNav}}" aria-label="باز کردن منو" class="btn mob-only" style="width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; color: var(--text); cursor: pointer; align-items: center; justify-content: center; padding: 0">
        <span class="ms" style="font-size: 20px">menu</span>
      </button>
      <div style="display: flex; align-items: center; gap: 10px; margin-inline-end: auto; min-width: 0; flex: 1 1 auto">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 11px; background: var(--primary-soft); color: var(--link); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms f" style="font-size: 20px">contacts</span></span>
        <div style="display: flex; flex-direction: column; gap: 1px; line-height: 1.3; min-width: 0">
          <h1 style="margin: 0; font-size: 14.5px; font-weight: 800; color: var(--ink)">حساب‌ها</h1>
          <span class="hide-sm" style="font-size: 11.5px; color: var(--muted)">مشتریان، تامین‌کننده‌ها و سایر حساب‌ها</span>
        </div>
      </div>
      <div class="zclk" role="timer" aria-label="ساعت و تاریخ" title="{{clkFull}}"><span class="ms zclk-ic" aria-hidden="true">schedule</span><b dir="ltr" class="zclk-t">{{clkTime}}</b><i aria-hidden="true"></i><span class="zclk-d">{{clkDate}}</span></div>
      <label class="hdr-search" style="display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; height: 34px; width: 240px; max-width: 100%; box-sizing: border-box; color: var(--subtle)">
        <span class="ms" style="font-size: 18px">search</span>
        <input type="search" placeholder="جستجو…" aria-label="جستجو" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--ink); flex: 1; min-width: 0">
      </label>
      <button aria-label="انتخاب شعبه" class="btn" style="display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: 12.5px; color: var(--ink); font-weight: 600; cursor: pointer">
        <span class="ms" style="font-size: 17px; color: var(--muted)">storefront</span>
        <span class="hide-sm">همه شعبه‌ها</span>
        <span class="ms" style="font-size: 17px; color: var(--muted)">expand_more</span>
      </button>
      <div title="3 یوزر آنلاین" class="hide-sm" style="display: flex; align-items: center; padding: 0 4px">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--link); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">H</span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3); color: var(--text); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; margin-inline-start: -8px">ا</span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3); color: var(--text); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; margin-inline-start: -8px">م</span>
      </div>
      <nav class="lang" aria-label="زبان" style="display: flex; gap: 2px; background: var(--surface-3); border-radius: 10px; padding: 3px; height: 34px; box-sizing: border-box">
        <a href="{{lnk.fa}}" data-l="fa" lang="fa">دری</a>
        <a href="{{lnk.ps}}" data-l="ps" lang="ps">پښتو</a>
        <a href="{{lnk.en}}" data-l="en" lang="en">EN</a>
      </nav>
      <button onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" class="btn" style="width: 34px; height: 34px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
        <span class="ms" style="font-size: 19px">{{themeIcon}}</span>
      </button>
      <div style="position: relative">
      <button onClick="{{toggleNotif}}" aria-label="{{bellLabel}}" aria-expanded="{{notifExpanded}}" aria-haspopup="dialog" class="btn" style="{{bellStyle}}">
        <span class="ms" style="font-size: 19px">notifications</span>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}">
          <span style="position: absolute; top: -5px; inset-inline-end: -5px; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #DC2626; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg)">{{unread}}</span>
        </sc-if>
      </button>
      <sc-if value="{{notifOpen}}" hint-placeholder-val="{{ false }}">
        <div onClick="{{closeNotif}}" style="position: fixed; inset: 0; z-index: 44"></div>
        <div role="dialog" aria-label="اعلان‌ها" class="np" style="position: absolute; top: 42px; inset-inline-end: 0; z-index: 45; width: 380px; max-height: min(560px, 75vh); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 48px -16px rgba(11,21,48,.35); overflow: hidden">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 8px">
            <span style="font-size: 14px; font-weight: 800; color: var(--ink)">اعلان‌ها</span>
            <button onClick="{{markAll}}" class="btn" style="display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 0; background: transparent; border-radius: 8px; font: inherit; font-size: 12px; font-weight: 700; color: var(--link); cursor: pointer">
              <span class="ms" style="font-size: 16px">done_all</span>همه خوانده شد
            </button>
          </div>
          <div role="tablist" aria-label="دسته اعلان‌ها" style="display: flex; gap: 4px; padding: 0 14px 10px; border-bottom: 1px solid var(--border-soft); overflow-x: auto">
            <sc-for list="{{nTabs}}" as="t" hint-placeholder-count="4">
              <button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}<span style="{{t.countStyle}}">{{t.count}}</span></button>
            </sc-for>
          </div>
          <div class="scroll" style="flex: 1; overflow-y: auto; padding: 6px">
            <sc-for list="{{nItems}}" as="n" hint-placeholder-count="5">
              <a href="#" class="row" style="display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--text); position: relative">
                <span style="{{n.tile}}"><span class="ms f" style="font-size: 17px">{{n.icon}}</span></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; line-height: 1.4">
                  <span style="display: flex; align-items: center; gap: 6px">
                    <span style="{{n.srcStyle}}">{{n.src}}</span>
                    <span style="font-size: 11px; color: var(--subtle)">{{n.time}}</span>
                  </span>
                  <span style="{{n.titleStyle}}">{{n.title}}</span>
                  <span style="font-size: 11.5px; color: var(--muted)">{{n.meta}}</span>
                  <sc-if value="{{n.action}}" hint-placeholder-val="{{ false }}">
                    <span style="align-self: flex-start; margin-top: 4px; font-size: 11.5px; font-weight: 700; color: var(--link); border: 1px solid var(--border-strong); border-radius: 7px; padding: 2px 8px">{{n.action}}</span>
                  </sc-if>
                </span>
                <sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}">
                  <span aria-label="خوانده نشده" style="width: 8px; height: 8px; border-radius: 50%; background: #2F6FED; margin-top: 6px; flex-shrink: 0"></span>
                </sc-if>
              </a>
            </sc-for>
          </div>
          <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 42px; border-top: 1px solid var(--border-soft); font-size: 12.5px; font-weight: 700">همه اعلان‌ها</a>
        </div>
      </sc-if>
      </div>
    </div>
  </header>

  <div class="{{wrapCls}}" style="max-width: 1400px; margin: 0 auto; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box">

  <!-- Sub-navigation + page actions -->
  <div class="no-print" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
    <sc-if value="{{notJr}}" hint-placeholder-val="{{ true }}">
    <nav aria-label="بخش‌های حساب‌ها" style="display: flex; gap: 2px; background: var(--surface-3); border-radius: 10px; padding: 2px; overflow-x: auto; max-width: 100%">
      <sc-for list="{{topTabs}}" as="tb" hint-placeholder-count="3"><button type="button" onClick="{{tb.pick}}" aria-current="{{tb.cur}}" style="{{tb.style}}"><span class="ms" style="font-size: 16px">{{tb.icon}}</span>{{tb.t}}</button></sc-for>
    </nav>
    </sc-if>
    <sc-if value="{{isGAny}}" hint-placeholder-val="{{ false }}">
    <nav aria-label="گزارشات" style="display: flex; gap: 2px; background: var(--surface-3); border-radius: 10px; padding: 2px; overflow-x: auto; max-width: 100%">
      <sc-for list="{{gTabs}}" as="tb" hint-placeholder-count="2"><button type="button" onClick="{{tb.pick}}" aria-current="{{tb.cur}}" style="{{tb.style}}"><span class="ms" style="font-size: 16px">{{tb.icon}}</span>{{tb.t}}</button></sc-for>
    </nav>
    </sc-if>
    <sc-if value="{{isXAny}}" hint-placeholder-val="{{ false }}">
    <nav aria-label="بخش‌های صرافی" style="display: flex; gap: 2px; background: var(--surface-3); border-radius: 10px; padding: 2px; overflow-x: auto; max-width: 100%">
      <sc-for list="{{xTabs}}" as="tb" hint-placeholder-count="2"><button type="button" onClick="{{tb.pick}}" aria-current="{{tb.cur}}" style="{{tb.style}}"><span class="ms" style="font-size: 16px">{{tb.icon}}</span>{{tb.t}}</button></sc-for>
    </nav>
    </sc-if>
    <sc-if value="{{isJrAny}}" hint-placeholder-val="{{ false }}">
    <nav aria-label="بخش‌های روزنامچه" style="display: flex; gap: 2px; background: var(--surface-3); border-radius: 10px; padding: 2px; overflow-x: auto; max-width: 100%">
      <sc-for list="{{jrTabs}}" as="tb" hint-placeholder-count="2"><button type="button" onClick="{{tb.pick}}" aria-current="{{tb.cur}}" style="{{tb.style}}"><span class="ms" style="font-size: 16px">{{tb.icon}}</span>{{tb.t}}</button></sc-for>
    </nav>
    </sc-if>
    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
      <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
      <div style="position: relative">
        <button onClick="{{toggleDl}}" aria-expanded="{{dlExpanded}}" aria-haspopup="menu" class="btn" style="display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer">
          <span class="ms" style="font-size: 18px; color: var(--muted)">download</span><span class="hide-sm">دانلود</span><span class="ms" style="font-size: 16px; color: var(--muted)">expand_more</span>
        </button>
        <sc-if value="{{dlOpen}}" hint-placeholder-val="{{ false }}">
          <div onClick="{{closeDl}}" style="position: fixed; inset: 0; z-index: 19"></div>
          <div role="menu" style="position: absolute; top: 40px; inset-inline-end: 0; z-index: 20; min-width: 190px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 24px 48px -16px rgba(11,21,48,.35); padding: 4px">
            <a href="#" role="menuitem" class="row" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--text); font-size: 12.5px"><span class="ms" style="font-size: 18px; color: var(--ok-text)">table_view</span><span style="flex: 1">Excel</span><span style="font-size: 10.5px; color: var(--subtle)">همه ردیف‌ها</span></a>
            <a href="#" role="menuitem" class="row" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--text); font-size: 12.5px"><span class="ms" style="font-size: 18px; color: var(--danger-text)">picture_as_pdf</span><span style="flex: 1">PDF</span><span style="font-size: 10.5px; color: var(--subtle)">A4</span></a>
            <button onClick="{{printReport}}" role="menuitem" class="row" style="width: 100%; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-size: 12.5px; cursor: pointer; text-align: start"><span class="ms" style="font-size: 18px; color: var(--muted)">print</span>چاپ گزارش</button>
          </div>
        </sc-if>
      </div>
      </sc-if>
      <sc-if value="{{notJr}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{openNew}}" class="btnp" style="display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 14px; border: 0; background: #2F6FED; border-radius: 10px; font: inherit; font-size: 12.5px; font-weight: 700; color: #FFFFFF; cursor: pointer; box-shadow: 0 8px 18px -8px rgba(47,111,237,.9)"><span class="ms" style="font-size: 18px">person_add</span>جدید</button>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
  <!-- print header (only on paper) -->
  <div class="print-only" style="display: none; justify-content: space-between; align-items: flex-end; padding-bottom: 8px; border-bottom: 2px solid #0B1530">
    <span style="font-size: 18px; font-weight: 800">فهرست حساب‌ها</span><span style="font-size: 12px">{{periodText}} · {{curNote}}</span>
  </div>

  <!-- KPI cards -->
  <section aria-label="خلاصه گزارش" class="kpi" style="{{kpiGrid}}">
    <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
      <article class="kcard" data-hero="{{k.hero}}" title="{{k.full}}">
        <span class="ktile" style="{{k.tile}}"><span class="ms f" style="font-size: 16px">{{k.icon}}</span></span>
        <div class="kbody">
          <span class="klabel">{{k.label}}</span>
          <span class="krow"><span class="kval" dir="ltr" style="{{k.valStyle}}">{{k.value}}</span><span class="kunit">{{k.unit}}</span></span>
          <span class="ksub">{{k.sub}}</span>
        </div>
        <div class="kside">
          <sc-if value="{{k.chip}}" hint-placeholder-val="{{ false }}"><span dir="ltr" class="kchip" style="{{k.chipStyle}}">{{k.chip}}</span></sc-if>
          <sc-if value="{{k.spark}}" hint-placeholder-val="{{ false }}">
            <svg width="56" height="20" viewBox="0 0 120 36" preserveAspectRatio="none" aria-hidden="true"><polyline points="{{k.spark}}" fill="none" style="{{k.sparkStyle}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
          </sc-if>
          <sc-if value="{{k.bar}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" class="kbar"><span style="{{k.bar}}"></span></span>
          </sc-if>
        </div>
      </article>
    </sc-for>
  </section>

  <!-- report table card -->
  <section aria-label="جدول گزارش" style="display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: visible; box-shadow: 0 1px 2px rgba(11,21,48,.04)">
    <!-- view switch + search + period + filter -->
    <div class="no-print" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border-soft)">

  <!-- exchange view / receipt -->
  <sc-if value="{{xch.vw.open}}" hint-placeholder-val="{{ false }}">

    <div role="dialog" aria-modal="true" aria-label="رسید تبادله" class="print-sheet" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 43; width: 440px; max-width: calc(100vw - 24px); background: var(--surface); border-radius: 14px; box-shadow: 0 30px 70px -20px rgba(11,21,48,.55); overflow: hidden">
      <div style="height: 5px; background: linear-gradient(90deg, #7C3AED, #2F6FED)"></div>
      <div style="display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--border-soft)">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px; color: var(--ink)">رسید تبادله <span dir="ltr" style="font-family: Inter, sans-serif">{{xch.vw.no}}</span></b><span style="font-size: 11.5px; color: var(--muted)">{{xch.vw.acc}} · <span dir="ltr" style="font-family: Inter, sans-serif">{{xch.vw.d}}</span></span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 4px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: #FDECEF"><span style="height: 22px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 800; color: #FFFFFF; background: #D64560">باقیدار</span><span style="flex: 1; font-size: 12px; color: var(--muted)">دادیم</span><b dir="ltr" style="font-family: Inter, sans-serif; font-size: 15px; color: #B42335">{{xch.vw.dv}}</b></div>

        <button type="button" onClick="{{xch.vw.print}}" class="btnp" style="height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 8px; background: #2F6FED; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer"><span class="ms" style="font-size: 16px">print</span>چاپ</button>

<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { notifOpen: false, nTab: 'all', allRead: false, dark: !!this.props.dark, rwRange: 'today', whRange: 'week', whHidden: {}, mobileOpen: false, collapsed: false, reportsOpen: false, att: 'stock', range: 'week', hidden: {}, editRates: false, tx: 'all' };
  }
  renderVals() {
    const s = this.state;
    const fmt = (n) => Math.round(n).toLocaleString('en-US');

    const pts = (a, w, h, pad) => {
      const max = Math.max(...a), min = Math.min(...a), r = (max - min) || 1;
      return a.map((v, i) => (i / (a.length - 1) * w).toFixed(1) + ',' + (pad + (h - 2 * pad) * (1 - (v - min) / r)).toFixed(1)).join(' ');
    };
    const W = {
      sales: [6200, 3100, 7400, 8100, 6900, 9050, 7940],
      buy: [4800, 0, 5200, 3900, 6100, 4300, 5060],
      exp: [350, 0, 420, 180, 600, 250, 0],
      profit: [980, 410, 1150, 1320, 1010, 1460, 1249]
    };
    const spark = { sales: pts(W.sales, 120, 36, 4), buy: pts(W.buy, 120, 36, 4), exp: pts(W.exp, 120, 36, 4), profit: pts(W.profit, 120, 36, 4) };

    const M = {
      sales: [41200, 45800, 39900, 48600],
      buy: [30100, 33500, 28700, 34900],
      exp: [2100, 1900, 2600, 2300],
      profit: [6800, 7400, 6100, 8200]
    };
    const D = s.range === 'week' ? W : M;
    const xlabels = s.range === 'week'
      ? ['پنج‌شنبه', 'جمعه', 'شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'امروز']
      : ['هفته 1', 'هفته 2', 'هفته 3', 'هفته 4'];
    const keys = ['sales', 'buy', 'profit', 'exp'];
    const visible = keys.filter((k) => !s.hidden[k]);
    const rawMax = Math.max(1, ...visible.flatMap((k) => D[k]));
    const mag = Math.pow(10, Math.floor(Math.log10(rawMax)));
    const nice = Math.ceil(rawMax / mag) * mag;
    const CH = 250, CW = 700, TOP = 10;
    const line = (a) => a.map((v, i) => (i / (a.length - 1) * CW).toFixed(1) + ',' + (TOP + (CH - TOP) * (1 - v / nice)).toFixed(1)).join(' ');
    const lines = { sales: line(D.sales), buy: line(D.buy), profit: line(D.profit), exp: line(D.exp) };
    const area = '0,' + CH + ' ' + lines.sales + ' ' + CW + ',' + CH;
    const short = (n) => n >= 1000 ? (n / 1000) + 'k' : String(n);
    const ticks = [1, 0.75, 0.5, 0.25, 0].map((f) => ({
      label: short(nice * f),
      style: 'position: absolute; left: 0; right: 0; height: 0; display: flex; align-items: center; gap: 6px; top: ' + ((TOP + (CH - TOP) * (1 - f)) / CH * 100).toFixed(2) + '%'
    }));
    const svgBase = 'position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; ';
    const vis = {};
    keys.forEach((k) => { vis[k] = svgBase + (s.hidden[k] ? 'display: none' : ''); });
    const COL = { sales: 'var(--link)', buy: '#64748B', profit: '#16A34A', exp: '#D97706' };
    const NAME = { sales: 'فروش', buy: 'خرید', profit: 'مفاد', exp: 'مصرف' };
    const legend = keys.map((k) => {
      const off = !!s.hidden[k];
      return {
        label: NAME[k], pressed: off ? 'false' : 'true',
        toggle: () => this.setState({ hidden: Object.assign({}, s.hidden, { [k]: !off }) }),
        dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + (off ? 'var(--disabled)' : COL[k]),
        style: 'display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid ' + (off ? 'var(--border)' : 'var(--border-strong)') + '; background: ' + (off ? 'var(--surface)' : 'var(--hover-bg)') + '; color: ' + (off ? '#94A3B8' : '#0B1530')
      };
    });
    const totals = keys.map((k) => ({
      label: NAME[k] + (s.range === 'week' ? ' (7 روز)' : s.range === 'month' ? ' (ماه)' : ' (بازه)'),
      value: fmt(D[k].reduce((a, b) => a + b, 0)),
      dot: 'width: 7px; height: 7px; border-radius: 50%; background: ' + COL[k]
    }));
    const seg = (on) => 'height: 28px; padding: 0 11px; border: 0; border-radius: 7px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; ' + (on ? 'background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(15,23,42,.12)' : 'background: transparent; color: var(--muted)');
    // ---- custom date range (one per chart) ----
    const CP = s.cp || {};
    const setCP = (k, patch, extra) => this.setState(Object.assign({ cp: Object.assign({}, CP, { [k]: Object.assign({}, CP[k] || {}, patch) }) }, extra || {}));
    const PRESETS = [['yday', 'دیروز'], ['d30', '30 روز'], ['m3', '3 ماه'], ['year', 'امسال']];
    const mkCP = (k, rangeKey, fallback) => {
      const c = CP[k] || {};
      return {
        open: !!c.open, from: c.from || '', to: c.to || '', label: c.label || '',
        showChip: !c.open && s[rangeKey] === 'custom' && !!c.label,
        presets: PRESETS.map(([id, label]) => ({
          label, pick: () => setCP(k, { open: false, preset: id, label }),
          style: 'height: 28px; padding: 0 10px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; ' + (c.preset === id ? 'background: var(--primary-soft); color: var(--link); border: 1px solid var(--border-strong)' : 'background: var(--surface); color: var(--text); border: 1px solid var(--border)')
        })),
        setFrom: (e) => setCP(k, { from: e.target.value }),
        setTo: (e) => setCP(k, { to: e.target.value }),
        apply: () => setCP(k, { open: false, preset: '', label: (c.from || '…') + ' – ' + (c.to || '…') }),
        cancel: () => c.label ? setCP(k, { open: false }) : setCP(k, { open: false }, { [rangeKey]: fallback }),
        reopen: () => setCP(k, { open: true })
      };
    };
    const cp = { trend: mkCP('trend', 'range', 'week'), rw: mkCP('rw', 'rwRange', 'today'), wh: mkCP('wh', 'whRange', 'week') };
    const mkRanges = (opts, rangeKey, k) => opts.map(([id, label]) => ({
      label: id === 'custom' ? 'دلخواه' : label,
      pressed: s[rangeKey] === id ? 'true' : 'false', style: seg(s[rangeKey] === id),
      pick: () => id === 'custom' ? setCP(k, { open: true }, { [rangeKey]: 'custom' }) : setCP(k, { open: false }, { [rangeKey]: id })
    }));
    const ranges = mkRanges([['week', '7 روز'], ['month', 'این ماه'], ['custom', '']], 'range', 'trend');


    // ---- returns & waste donut (sample) ----
    const RW = {
      today: { s: [640, 2], p: [1150, 1], w: [210, 3] },
      month: { s: [4820, 14], p: [7300, 6], w: [1960, 22] }
    }[s.rwRange === 'today' ? 'today' : 'month'];
    const C = 2 * Math.PI * 40;
    const tot = RW.s[0] + RW.p[0] + RW.w[0];
    let acc = 0;
    const seg2 = (v) => { const len = tot ? v / tot * C : 0; const gap = len > 2 ? 1.5 : 0; const o = { dash: Math.max(0, len - gap).toFixed(2) + ' ' + C.toFixed(2), off: (-acc).toFixed(2) }; acc += len; return o; };
    const pct = (v) => tot ? Math.round(v / tot * 100) + '%' : '0%';
    const dot = (c) => 'width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; background: ' + c;
    const unit = s.rwRange === 'today' ? ' مورد امروز' : s.rwRange === 'month' ? ' مورد این ماه' : ' مورد';
    const donut = {
      s: seg2(RW.s[0]), p: seg2(RW.p[0]), w: seg2(RW.w[0]),
      total: fmt(tot), empty: tot === 0,
      legend: [
        { label: 'برگشت فروش', value: fmt(RW.s[0]), pct: pct(RW.s[0]), count: RW.s[1] + unit, dot: dot('#D97706') },
        { label: 'برگشت خرید', value: fmt(RW.p[0]), pct: pct(RW.p[0]), count: RW.p[1] + unit, dot: dot('#64748B') },
        { label: 'ضایعات', value: fmt(RW.w[0]), pct: pct(RW.w[0]), count: RW.w[1] + unit, dot: dot('#DC2626') }
      ]
    };
    const rwRanges = mkRanges([['today', 'امروز'], ['month', 'این ماه'], ['custom', '']], 'rwRange', 'rw');

    // ---- warehouse stock line (sample, thousand AFN) ----
    const WH = s.whRange === 'week'
      ? { a: [412, 405, 398, 420, 415, 409, 402], b: [188, 192, 185, 180, 196, 201, 198], c: [64, 61, 58, 66, 63, 60, 57] }
      : { a: [430, 421, 410, 402], b: [176, 182, 190, 198], c: [70, 67, 62, 57] };
    const whX = s.whRange === 'week' ? xlabels.length === 7 ? xlabels : ['پنج‌شنبه', 'جمعه', 'شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'امروز'] : ['هفته 1', 'هفته 2', 'هفته 3', 'هفته 4'];
    const WHM = { a: ['مرکزی', 'var(--link)'], b: ['شعبه دوم', 'var(--primary-300)'], c: ['دکان', '#94A3B8'] };
    const whKeys = ['a', 'b', 'c'];
    const whVisible = whKeys.filter((k) => !s.whHidden[k]);
    const whRaw = Math.max(1, ...(whVisible.length ? whVisible : whKeys).flatMap((k) => WH[k]));
    const whMag = Math.pow(10, Math.floor(Math.log10(whRaw)));
    const whNice = Math.ceil(whRaw / whMag) * whMag;
    const whLine = (a) => a.map((v, i) => (i / (a.length - 1) * CW).toFixed(1) + ',' + (TOP + (CH - TOP) * (1 - v / whNice)).toFixed(1)).join(' ');
    const whLines = { a: whLine(WH.a), b: whLine(WH.b), c: whLine(WH.c) };
    const whArea = '0,' + CH + ' ' + whLines.a + ' ' + CW + ',' + CH;
    const whTicks = [1, 0.75, 0.5, 0.25, 0].map((f) => ({
      label: String(Math.round(whNice * f)),
      style: 'position: absolute; left: 0; right: 0; height: 0; display: flex; align-items: center; gap: 6px; top: ' + ((TOP + (CH - TOP) * (1 - f)) / CH * 100).toFixed(2) + '%'
    }));
    const whVis = {};
    whKeys.forEach((k) => { whVis[k] = svgBase + (s.whHidden[k] ? 'display: none' : ''); });
    const whCards = whKeys.map((k) => {
      const a = WH[k], last = a[a.length - 1], first = a[0], off = !!s.whHidden[k];
      const ch = ((last - first) / first * 100);
      const up = ch >= 0;
      return {
        name: WHM[k][0], value: last, pressed: off ? 'false' : 'true',
        chg: (up ? '↑ ' : '↓ ') + Math.abs(ch).toFixed(1) + '%',
        chgStyle: 'font-size: 10.5px; font-weight: 700; color: ' + (up ? 'var(--ok-text)' : 'var(--warn-text)'),
        dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + (off ? 'var(--disabled)' : WHM[k][1]),
        toggle: () => this.setState({ whHidden: Object.assign({}, s.whHidden, { [k]: !off }) }),
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 7px 10px; border-radius: 10px; font: inherit; text-align: right; cursor: pointer; opacity: ' + (off ? '.55' : '1') + '; background: ' + (off ? 'var(--surface)' : '#F8FAFC') + '; border: 1px solid ' + (off ? 'var(--border)' : 'var(--border)')
      };
    });
    const whRanges = mkRanges([['week', '7 روز'], ['month', 'این ماه'], ['custom', '']], 'whRange', 'wh');


    // ---- account types (sample counts) ----
    const ACC = [
      ['customers', 'مشتریان', 'groups', 148, 'var(--primary-soft)', 'var(--link)'],
      ['suppliers', 'تأمین‌کنندگان', 'local_shipping', 36, 'var(--primary-soft)', 'var(--link)'],
      ['employees', 'کارمندان', 'badge', 12, 'var(--primary-soft)', 'var(--link)'],
      ['cash', 'صندوق‌ها', 'point_of_sale', 4, 'var(--primary-soft)', 'var(--link)'],
      ['banks', 'بانک‌ها', 'account_balance', 3, 'var(--primary-soft)', 'var(--link)'],
      ['exchangers', 'صرافان', 'currency_exchange', 5, 'var(--primary-soft)', 'var(--link)'],
      ['partners', 'شرکا', 'handshake', 2, 'var(--primary-soft)', 'var(--link)'],
      ['expense', 'مصارف', 'receipt_long', 18, 'var(--primary-soft)', 'var(--link)'],
      ['income', 'عواید', 'savings', 6, 'var(--primary-soft)', 'var(--link)'],
      ['other', 'سایر', 'more_horiz', 9, 'var(--primary-soft)', 'var(--link)']
    ];
    const NEW = { customers: 6, suppliers: 1, employees: 0, cash: 0, banks: 0, exchangers: 1, partners: 0, expense: 2, income: 0, other: 0 };
    const accMax = Math.max(...ACC.map((a) => a[3]));

  window.__dc = { comp: comp, paint: paint };
})();

</script>
