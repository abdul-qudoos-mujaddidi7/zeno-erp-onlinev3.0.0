.sb-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sb-meta-t{display:flex;align-items:center;gap:8px}
.sb-docl{font-weight:700;color:#55617E}
.sb-meta-g{display:grid;grid-template-columns:repeat(4,auto);gap:4px 16px}
.sb-meta-g>span{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.sb-meta-g i{font-style:normal;font-size:.78em;color:#8A96B8}
.sb-meta-g b{font-weight:800;color:var(--brd)}
.sb-custline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px;padding:2px 2px 0}
.sb-custline>span{display:inline-flex;align-items:baseline;gap:6px;min-width:0}
.sb-custline i{font-style:normal;color:#8A96B8;font-size:.85em}
.sb-custline i::after{content:":"}
.sb-custline b{font-weight:800;color:var(--brd)}
.sb-ca{flex:1;min-width:0}.sb-ca b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot{display:grid;grid-template-columns:1fr minmax(220px,.9fr);gap:16px;align-items:start}
.sb-side{display:flex;flex-direction:column;gap:12px}
.sb-tot{display:flex;flex-direction:column;border:1px solid #D5DCE8;border-radius:10px;overflow:hidden}
.sb-tot>div,.sb-tot>sc-if>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 14px;border-bottom:1px dashed #E2E7F0}
.sb-tot>sc-if{display:contents}
.sb-tot span{color:#55617E;white-space:nowrap}.sb-tot span i{font-style:normal;color:#8A96B8;margin-inline-start:4px}
.sb-tot b{font-weight:800;color:var(--brd);font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.sb-tot .sb-pay{background:var(--brd);border-bottom:0;padding-block:9px}
.sb-tot .sb-pay span{color:#C9D4EE;font-weight:700}.sb-tot .sb-pay b{color:#fff;font-size:1.25em}
.sb-bal em{font-style:normal;font-size:.75em;font-weight:800;padding:1px 6px;border-radius:999px;background:#EEF1F6;color:#475569;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-bal[data-k=owe] b{color:#C81E1E}.sb-bal[data-k=owe] em{background:#FDECEC;color:#C81E1E}
.sb-bal[data-k=cr] b{color:#15803D}.sb-bal[data-k=cr] em{background:#E4F5EA;color:#15803D}
.sb-bal-now{background:#F7F9FC;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sb-bal-now b{font-size:1.1em}
.sb-unit{padding:5px 14px;font-size:.78em;color:#8A96B8;text-align:left;border-bottom:0!important}
.sb .sb-words{flex-direction:column;align-items:flex-start;gap:2px}
.sb-notes{min-height:56px}
/* A3: roomier */
.sp-sheet.sb[data-f=a3] .sb-ir{padding-block:7px!important}
.sp-sheet.sb[data-f=a3] .sb-hd::after{width:160px}
/* 80mm roll */
.sp-sheet.sb[data-f=roll]::before{height:4px}
.sp-sheet.sb[data-f=roll] .sb-hd{flex-direction:column;align-items:center;text-align:center;gap:10px}
.sp-sheet.sb[data-f=roll] .sb-hd::after{inset-inline-start:50%;transform:translateX(50%);width:90px}
.sp-sheet.sb[data-f=roll] .gs-co{flex-direction:column;align-items:center}
.sp-sheet.sb[data-f=roll] .gs-co-t{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-meta{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-meta-t{flex-wrap:wrap;justify-content:center}
.sp-sheet.sb[data-f=roll] .sb-meta-g{grid-template-columns:repeat(2,auto)}
.sp-sheet.sb[data-f=roll] .sb-meta-g>span{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-custline{flex-direction:column;gap:2px}
.sp-sheet.sb[data-f=roll] .sb-ca b{white-space:normal}
.sp-sheet.sb[data-f=roll] .sb-foot{grid-template-columns:1fr}
.sp-sheet.sb[data-f=roll] .sb-tot{order:-1}
.sp-sheet.sb[data-f=roll] .sb-tot>div,.sp-sheet.sb[data-f=roll] .sb-tot>sc-if>div{padding:5px 8px}
.sp-sheet.sb[data-f=roll] .sb-2 span{white-space:normal}
@container (max-width:520px){.sb-foot{grid-template-columns:1fr}.sb-tot{order:-1}}
.sb-tot b span{color:inherit!important}
.sb-meta-t{flex-wrap:wrap;justify-content:flex-end}
.sb-meta-t>*{white-space:nowrap}
.sb-meta-g b{white-space:nowrap}
.sb .gs-co{min-width:0;flex:1}
@container (max-width:520px){.sb-meta-g{grid-template-columns:repeat(2,auto)}.sb-meta-t .sb-chip{font-size:.72em}}

.sp-sheet.sb[data-f=a3]::after{width:110px;height:122px;top:-12px;left:-11px}
.sp-sheet.sb[data-f=roll]::after{width:52px;height:58px;top:-6px;left:-5px;opacity:.12}

.sp-sheet.sb[data-f=roll] .sb-meta{padding-inline-end:0}
.sb-tg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid #D5DCE8;border-radius:10px;overflow:hidden}
.sb-tg>sc-if{display:contents}
.sb-tg>div,.sb-tg>sc-if>div{display:flex;flex-direction:column;gap:1px;padding:6px 10px;min-width:0;border-inline-start:1px solid #E6EAF1;border-top:1px solid #E6EAF1}
.sb-tg>div:nth-child(-n+4){border-top:0}
.sb-tg>div:nth-child(4n+1){border-inline-start:0}
.sb-tg span{font-size:.78em;color:#8A96B8;white-space:nowrap;display:flex;align-items:center;gap:4px}
.sb-tg span i{font-style:normal}
.sb-tg b{font-weight:800;color:var(--brd);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:1.02em;text-align:right}
.sb-tg-pay{grid-column:span 2;background:var(--brd);border-inline-start:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.sb-tg-bal em{font-style:normal;font-size:.9em;font-weight:800;padding:0 5px;border-radius:999px;background:#EEF1F6;color:#475569;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-tg-bal[data-k=owe] b{color:#C81E1E!important}.sb-tg-bal[data-k=owe] em{background:#FDECEC;color:#C81E1E}
.sb-tg-bal[data-k=cr] b{color:#15803D!important}.sb-tg-bal[data-k=cr] em{background:#E4F5EA;color:#15803D}
.sb-wn{display:flex;flex-direction:column;gap:4px;padding:0 2px}
.sb-wn>div{display:flex;gap:8px;align-items:baseline;min-width:0}
.sb-wn>div>span{font-size:.82em;color:#8A96B8;flex-shrink:0}.sb-wn>div>span::after{content:":"}
.sb-wn>div>b{font-weight:700;color:var(--brd)}
.sb-wn small{font-size:.75em;color:#A0AAC2;text-align:left}
.sp-sheet.sb[data-f=roll] .sb-tg{grid-template-columns:1fr 1fr}
.sp-sheet.sb[data-f=roll] .sb-tg>div,.sp-sheet.sb[data-f=roll] .sb-tg>sc-if>div{border-inline-start:0;border-top:1px solid #E6EAF1}

.sp-sheet.sb[data-f=roll] .sb-tg>div:nth-child(-n+2){border-top:0}

.sp-sheet.sb[data-f=a3] .sb-shape{width:230px;height:256px;left:-24px;top:-22px}
.sp-sheet.sb[data-f=roll] .sb-shape{width:96px;height:108px;left:-10px;top:-10px}
.sb-co{position:relative;display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}
.sb-logo{width:46px;height:46px;flex-shrink:0;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.9em;color:#0B1530;background:linear-gradient(145deg,#FFFFFF,#DCE6FF);box-shadow:0 8px 20px -10px rgba(0,0,0,.6)}
.sb-co-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.sb-co-n{white-space:nowrap;font-size:1.55em;font-weight:900;letter-spacing:.2px;color:#fff;line-height:1.2}
.sb-co-s{color:#AFC0E6;font-size:.88em;font-weight:600}
.sb-co-i{display:flex;flex-wrap:wrap;gap:0 10px;color:#C9D4EE;font-size:.82em}
.sb-co-i>span+span::before{content:"·";margin-inline-end:10px;color:#6B7FB5}
.sb-doc{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;padding-inline-end:4px}
.sb-doc-l{font-size:.8em;font-weight:700;letter-spacing:1px;color:#93B4FF}
.sb-doc-n{font-size:1.9em;font-weight:900;color:#fff;line-height:1;letter-spacing:.5px;font-family:Inter,sans-serif}
.sb-doc-c{display:flex;gap:6px;margin-top:2px}
.sb-hd .sb-chip{background:rgba(255,255,255,.12)!important;color:#E6ECFA!important;border:1px solid rgba(255,255,255,.18)}
.sb-hd .sb-chip[data-s=ok]{background:rgba(34,197,94,.18)!important;color:#86EFAC!important;border-color:rgba(134,239,172,.35)}
.sb-hd .sb-chip[data-s=void]{background:rgba(248,113,113,.18)!important;color:#FCA5A5!important}
.sb-hd .sb-chip[data-s=ret],.sb-hd .sb-chip[data-s=part]{background:rgba(251,191,36,.16)!important;color:#FCD34D!important}
.sb-mrow{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:-4px;padding:8px 0;border-bottom:1px solid #E6EAF1}
.sb-mrow>span{display:flex;flex-direction:column;flex:1;min-width:0;padding-inline:10px;border-inline-start:1px solid #E6EAF1;line-height:1.3}
.sb-mrow>span:first-child{border-inline-start:0;padding-inline-start:0}
.sb-mrow i{font-style:normal;font-size:.75em;color:#8A96B8;letter-spacing:.2px}
.sb-mrow b{font-weight:800;color:#0B1530;white-space:nowrap}
/* footer */
.sb-tg{border:0!important;border-radius:12px!important;gap:1px;background:#E6EAF1;overflow:hidden}
.sb-tg>div,.sb-tg>sc-if>div{border:0!important;background:#F7F9FC;padding:7px 12px!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-tg-pay{background:linear-gradient(135deg,#0B1530,#1B2D6B)!important;position:relative}
.sb-tg-pay::before{content:"";position:absolute;inset-block:8px;inset-inline-start:0;width:3px;border-radius:3px;background:#6B9BFF}
.sb-tg-bal{background:#fff!important}
.sb-wn{flex-direction:row!important;flex-wrap:wrap;align-items:baseline;gap:4px 20px!important;padding:0 2px}
.sb-wn small{margin-inline-start:auto}
/* roll */
.sp-sheet.sb[data-f=roll] .sb-hd{flex-direction:column;align-items:center;text-align:center;gap:10px}
.sp-sheet.sb[data-f=roll] .sb-co{flex-direction:column}
.sp-sheet.sb[data-f=roll] .sb-co-t{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-co-n{white-space:normal}
.sp-sheet.sb[data-f=roll] .sb-doc{align-items:center}
.sp-sheet.sb[data-f=roll] .sb-mrow>span{flex:1 1 40%;border:0;padding:0}
.sp-sheet.sb[data-f=roll] .sb-wn{flex-direction:column!important}
@container (max-width:520px){.sb-mrow>span{flex:1 1 30%}.sb-mrow>span:nth-child(4){border-inline-start:0;padding-inline-start:0}}
.sb-mrow{display:grid!important;grid-template-columns:1.3fr .8fr .9fr .9fr 1fr;gap:0!important;font-size:.92em}
.sb-mrow>span{padding-inline:8px!important;border-inline-start:1px solid #E6EAF1!important}
.sb-mrow>span:first-child{border-inline-start:0!important;padding-inline-start:0!important}
@container (max-width:520px){.sb-mrow>span{flex:none}.sb-mrow>span:nth-child(4){border-inline-start:1px solid #E6EAF1!important;padding-inline-start:8px!important}}
.sp-sheet.sb[data-f=roll] .sb-mrow{grid-template-columns:1fr 1fr;gap:6px 0!important}
.sp-sheet.sb[data-f=roll] .sb-mrow>span{border:0!important;padding:0!important}
/* v8: info strip inside header band, ref under bill no */
.sb-hd{flex-wrap:wrap;row-gap:14px!important}
.sb-doc-r{font-size:.8em;color:#93A6D4;font-weight:600}.sb-doc-r b{color:#E6ECFA;font-weight:800;font-family:Inter,sans-serif;margin-inline-start:4px}
.sb-hstrip{position:relative;flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(2px)}
.sb-hstrip>span{display:flex;flex-direction:column;gap:1px;padding:7px 12px;min-width:0;border-inline-start:1px solid rgba(255,255,255,.12);line-height:1.25}
.sb-hstrip>span:first-child{border-inline-start:0}
.sb-hstrip i{font-style:normal;font-size:.74em;color:#93A6D4;letter-spacing:.2px}
.sb-hstrip b{font-weight:800;color:#fff;white-space:nowrap}
.sp-sheet.sb[data-f=roll] .sb-hstrip{grid-template-columns:1fr 1fr}
.sp-sheet.sb[data-f=roll] .sb-hstrip>span:nth-child(3){border-inline-start:0}
.sp-sheet.sb[data-f=roll] .sb-hstrip>span:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}
/* v9: classic invoice totals — label right, value left, one column */
.sb-end{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,44%);gap:24px;align-items:start;padding-top:4px}
.sb-end-side{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.sb-end-f{display:flex;flex-direction:column;gap:2px}
.sb-end-f span{font-size:.78em;color:#8A96B8}
.sb-end-f b{font-weight:700;color:#0B1530;line-height:1.5}
.sb-end-tot{display:flex;flex-direction:column}
.sb-end-tot>sc-if{display:contents}
.sb-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 2px}
.sb-r>span{color:#55617E;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sb-r>span i{font-style:normal;font-size:.85em;color:#8A96B8}
.sb-r>b{font-weight:700;color:#0B1530;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-r-pay{margin:4px 0;padding:8px 12px;border-radius:8px;background:#0B1530;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-r-pay>span{color:#C9D4EE;font-weight:700}
.sb-r-pay>b{color:#fff;font-size:1.3em;font-weight:900}
.sb-r-sep{margin-top:4px;padding-top:8px;border-top:1px solid #E2E7F0}
.sb-r-bal em{font-style:normal;font-size:.78em;font-weight:800;padding:0 6px;border-radius:999px;background:#EEF1F6;color:#475569;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb-r-bal[data-k=owe]>b{color:#C81E1E}.sb-r-bal[data-k=owe] em{background:#FDECEC;color:#C81E1E}
.sb-r-bal[data-k=cr]>b{color:#15803D}.sb-r-bal[data-k=cr] em{background:#E4F5EA;color:#15803D}
.sb-r-now>span{color:#0B1530;font-weight:800}.sb-r-now>b{font-weight:900;font-size:1.12em}
.sb-r-u{font-size:.72em;color:#A0AAC2;text-align:left;padding:4px 2px 0}
.sp-sheet.sb[data-f=a3] .sb-r{padding-block:6px}
.sp-sheet.sb[data-f=roll] .sb-end{grid-template-columns:1fr;gap:10px}
.sp-sheet.sb[data-f=roll] .sb-end-tot{order:-1}
.sp-sheet.sb[data-f=roll] .sb-r-pay{padding:6px 8px}
@container (max-width:420px){.sb-end{grid-template-columns:1fr}.sb-end-tot{order:-1}}
@container (min-width:361px){.sb-end{grid-template-columns:minmax(0,1fr) minmax(200px,48%)!important}.sb-end-tot{order:0!important}}
/* v10: date/time + counts stacked under chips */
.sb-dm{display:flex;gap:0;margin-top:6px;border-top:1px solid rgba(255,255,255,.14);padding-top:6px}
.sb-dm>div{display:flex;flex-direction:column;gap:2px;padding-inline:12px;border-inline-start:1px solid rgba(255,255,255,.14)}
.sb-dm>div:first-child{border-inline-start:0;padding-inline-start:0}
.sb-dm>div:last-child{padding-inline-end:0}
.sb-dm span{display:flex;justify-content:space-between;align-items:baseline;gap:10px;line-height:1.35}
.sb-dm i{font-style:normal;font-size:.76em;color:#93A6D4;white-space:nowrap}
.sb-dm b{font-weight:800;color:#fff;white-space:nowrap;font-size:.92em}
.sp-sheet.sb[data-f=roll] .sb-dm{justify-content:center}
.sp-sheet.sb:not([data-f=roll]) .sb-hd{flex-wrap:nowrap!important;align-items:flex-start}
.sb .sb-co{flex:1 1 auto!important;min-width:0!important}
.sb-dm>div{padding-inline:8px}
.sb-dm span{gap:6px}
.sb-dm b{font-size:.88em}
.sb-co-i{font-size:.78em}
/* v11: compact header + attached customer strip */
.sb-hd{padding:calc(var(--pad) - 6px) var(--pad) 12px!important;gap:14px!important}
.sb-shape{width:120px!important;height:134px!important;left:-12px!important;top:-12px!important}
.sp-sheet.sb[data-f=a3] .sb-shape{width:160px!important;height:178px!important}
.sp-sheet.sb[data-f=roll] .sb-shape{width:80px!important;height:90px!important}
.sb-logo{width:36px!important;height:36px!important;border-radius:10px!important;font-size:1.45em!important}
.sb-co{gap:10px!important}
.sb-co-n{font-size:1.3em!important}

<div dir="rtl" data-lang="fa" class="{{rootClass}}" style="font-family: 'Vazirmatn', 'Noto Sans Arabic', system-ui, sans-serif; color: var(--text); background: var(--bg); height: 100vh; display: flex; overflow: hidden; font-size: 13px; line-height: 1.55">

<aside class="{{sbClass}}" aria-label="منوی اصلی">
  <div style="display: flex; align-items: center; gap: 9px; padding: 14px 16px 10px; min-height: 56px; box-sizing: border-box">
    <div style="width: 32px; height: 32px; border-radius: 9px; background: #2F6FED; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0">Z</div>
    <div class="lbl" style="flex: 1; line-height: 1.15">
      <div style="font-weight: 800; font-size: 15px; color: #FFFFFF; letter-spacing: .6px">ZENO</div>
      <div style="font-size: 10.5px; color: #8A96B8">ERP · v3.2.6</div>
    </div>
    <button onClick="{{toggleSb}}" aria-label="جمع کردن منو" title="جمع / باز کردن منو" class="btn hide-c" style="width: 30px; height: 30px; border: 1px solid #1B2A52; background: #132042; border-radius: 8px; color: #8A96B8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
      <span class="ms" style="font-size: 18px">{{sbIcon}}</span>
    </button>
  </div>

  <div style="padding: 0 12px 4px">
    <a href="#" class="btnp" title="POS" style="display: flex; align-items: center; justify-content: center; gap: 7px; background: #2F6FED; color: #FFFFFF; border-radius: 10px; min-height: 38px; font-weight: 700; font-size: 13px; box-shadow: 0 8px 18px -8px rgba(47,111,237,.9)">
      <span class="ms f" style="font-size: 19px">point_of_sale</span>
      <span class="lbl">POS</span>
    </a>
  </div>

  <nav class="scroll" style="flex: 1; overflow-y: auto; padding: 2px 12px 10px; display: flex; flex-direction: column; gap: 1px">
    <div class="sec">اصلی</div>
    <a href="Main.html" class="nav" title="داشبورد"><span class="ms">space_dashboard</span><span class="lbl">داشبورد</span></a>

    <div class="sec">تجارت</div>
    <a href="Sales.html" class="nav on" aria-current="page" title="فروش‌ها"><span class="ms">shopping_cart</span><span class="lbl">فروش‌ها</span><span class="badge" title="پیش‌نویس‌ها">2</span></a>
    <a href="Purchases.html" class="nav" title="خریدها"><span class="ms">shopping_bag</span><span class="lbl">خریدها</span><span class="badge" title="پیش‌نویس‌ها">1</span></a>
    <a href="Products.html" class="nav" title="{{prodLabel}}"><span class="ms">{{prodIcon}}</span><span class="lbl">{{prodLabel}}</span></a>

    <div class="sec">مالی</div>
    <a href="Accounts.html" class="nav" title="حساب‌ها"><span class="ms">group</span><span class="lbl">حساب‌ها</span></a>
    <a href="Journal.html" class="nav" title="روزنامچه"><span class="ms">menu_book</span><span class="lbl">روزنامچه</span></a>
    <a href="Exchange.html" class="nav" title="صرافی"><span class="ms">currency_exchange</span><span class="lbl">صرافی</span></a>

    <div class="sec">مدیریت</div>
    <button class="nav" onClick="{{toggleReports}}" aria-expanded="{{reportsExpanded}}" title="گزارشات">
      <span class="ms">bar_chart_4_bars</span><span class="lbl" style="flex: 1">گزارشات</span>
      <span class="ms hide-c" style="{{reportsChevron}}">expand_more</span>
    </button>
    <sc-if value="{{reportsOpen}}" hint-placeholder-val="{{ false }}">
      <div class="hide-c" style="display: flex; flex-direction: column; padding: 2px 0 4px">
        <a href="SalesReport.html" class="sub">گزارش فروش</a>
        <a href="PurchaseReport.html" class="sub">گزارش خرید</a>
        <a href="ProfitLoss.html" class="sub">مفاد و زیان</a>
        <a href="StockReport.html" class="sub">گزارش موجودی</a>
      </div>
    </sc-if>
    <a href="Settings.html" class="nav" title="تنظیمات"><span class="ms">settings</span><span class="lbl">تنظیمات</span></a>
  </nav>

  <div style="padding: 10px 12px 12px; border-top: 1px solid #1B2A52">
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; background: #132042">
      <div style="position: relative; width: 32px; height: 32px; border-radius: 50%; background: #2F6FED; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0">H
        <span style="position: absolute; bottom: 0; inset-inline-end: 0; width: 9px; height: 9px; border-radius: 50%; background: #16A34A; border: 2px solid #132042"></span></div>
      <div class="lbl" style="flex: 1; line-height: 1.3; min-width: 0">
        <div style="color: #FFFFFF; font-weight: 700; font-size: 13px">hewad</div>
        <div style="font-size: 11px; color: #8A96B8">مدیر سیستم</div>
      </div>
      <button aria-label="خروج" title="خروج" class="btn hide-c" style="width: 30px; height: 30px; border: 0; background: transparent; border-radius: 8px; color: #8A96B8; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
        <span class="ms" style="font-size: 18px">logout</span>
      </button>
    </div>
  </div>
</aside>

<!-- ============ MAIN (scrolls on its own) ============ -->
<main class="scroll" style="flex: 1; min-width: 0; height: 100vh; overflow-y: auto">

  <!-- Compact sticky header -->
  <header style="position: sticky; top: 0; z-index: 5; background: var(--header-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border)">
    <div class="hdr" style="max-width: 1400px; margin: 0 auto; padding: 8px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 52px; box-sizing: border-box">
      <button onClick="{{openNav}}" aria-label="باز کردن منو" class="btn mob-only" style="width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; color: var(--text); cursor: pointer; align-items: center; justify-content: center; padding: 0">
        <span class="ms" style="font-size: 20px">menu</span>
      </button>
      <div style="display: flex; align-items: center; gap: 10px; margin-inline-end: auto; min-width: 0; flex: 1 1 auto">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 11px; background: var(--primary-soft); color: var(--link); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms f" style="font-size: 20px">shopping_cart</span></span>
        <div style="display: flex; flex-direction: column; gap: 1px; line-height: 1.3; min-width: 0">
          <h1 style="margin: 0; font-size: 14.5px; font-weight: 800; color: var(--ink)">فروش‌ها</h1>
          <span class="hide-sm" style="font-size: 11.5px; color: var(--muted)">بل‌ها، دریافت‌ها و برگشت‌های فروش</span>
        </div>
      </div>
      <div class="zclk" role="timer" aria-label="ساعت و تاریخ" title="{{clkFull}}"><span class="ms zclk-ic" aria-hidden="true">schedule</span><b dir="ltr" class="zclk-t">{{clkTime}}</b><i aria-hidden="true"></i><span class="zclk-d">{{clkDate}}</span></div>
      <label class="hdr-search" style="display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; height: 34px; width: 240px; max-width: 100%; box-sizing: border-box; color: var(--subtle)">
        <span class="ms" style="font-size: 18px">search</span>
        <input type="search" placeholder="جستجو…" aria-label="جستجو" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--ink); flex: 1; min-width: 0">
      </label>
      <button aria-label="انتخاب شعبه" class="btn" style="display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: 12.5px; color: var(--ink); font-weight: 600; cursor: pointer">
        <span class="ms" style="font-size: 17px; color: var(--muted)">storefront</span>
        <span class="hide-sm">همه شعبه‌ها</span>
        <span class="ms" style="font-size: 17px; color: var(--muted)">expand_more</span>
      </button>
      <div title="3 یوزر آنلاین" class="hide-sm" style="display: flex; align-items: center; padding: 0 4px">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--link); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">H</span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3); color: var(--text); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; margin-inline-start: -8px">ا</span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3); color: var(--text); border: 2px solid var(--bg); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; margin-inline-start: -8px">م</span>
      </div>
      <nav class="lang" aria-label="زبان" style="display: flex; gap: 2px; background: var(--surface-3); border-radius: 10px; padding: 3px; height: 34px; box-sizing: border-box">
        <a href="{{lnk.fa}}" data-l="fa" lang="fa">دری</a>
        <a href="{{lnk.ps}}" data-l="ps" lang="ps">پښتو</a>
        <a href="{{lnk.en}}" data-l="en" lang="en">EN</a>
      </nav>
      <button onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" class="btn" style="width: 34px; height: 34px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
        <span class="ms" style="font-size: 19px">{{themeIcon}}</span>
      </button>
      <div style="position: relative">
      <button onClick="{{toggleNotif}}" aria-label="{{bellLabel}}" aria-expanded="{{notifExpanded}}" aria-haspopup="dialog" class="btn" style="{{bellStyle}}">
        <span class="ms" style="font-size: 19px">notifications</span>
        <sc-if value="{{hasUnread}}" hint-placeholder-val="{{ true }}">
          <span style="position: absolute; top: -5px; inset-inline-end: -5px; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #DC2626; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg)">{{unread}}</span>
        </sc-if>
      </button>
      <sc-if value="{{notifOpen}}" hint-placeholder-val="{{ false }}">
        <div onClick="{{closeNotif}}" style="position: fixed; inset: 0; z-index: 44"></div>
        <div role="dialog" aria-label="اعلان‌ها" class="np" style="position: absolute; top: 42px; inset-inline-end: 0; z-index: 45; width: 380px; max-height: min(560px, 75vh); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 48px -16px rgba(11,21,48,.35); overflow: hidden">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 8px">
            <span style="font-size: 14px; font-weight: 800; color: var(--ink)">اعلان‌ها</span>
            <button onClick="{{markAll}}" class="btn" style="display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 0; background: transparent; border-radius: 8px; font: inherit; font-size: 12px; font-weight: 700; color: var(--link); cursor: pointer">
              <span class="ms" style="font-size: 16px">done_all</span>همه خوانده شد
            </button>
          </div>
          <div role="tablist" aria-label="دسته اعلان‌ها" style="display: flex; gap: 4px; padding: 0 14px 10px; border-bottom: 1px solid var(--border-soft); overflow-x: auto">
            <sc-for list="{{nTabs}}" as="t" hint-placeholder-count="4">
              <button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}<span style="{{t.countStyle}}">{{t.count}}</span></button>
            </sc-for>
          </div>
          <div class="scroll" style="flex: 1; overflow-y: auto; padding: 6px">
            <sc-for list="{{nItems}}" as="n" hint-placeholder-count="5">
              <a href="#" class="row" style="display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--text); position: relative">
                <span style="{{n.tile}}"><span class="ms f" style="font-size: 17px">{{n.icon}}</span></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; line-height: 1.4">
                  <span style="display: flex; align-items: center; gap: 6px">
                    <span style="{{n.srcStyle}}">{{n.src}}</span>
                    <span style="font-size: 11px; color: var(--subtle)">{{n.time}}</span>
                  </span>
                  <span style="{{n.titleStyle}}">{{n.title}}</span>
                  <span style="font-size: 11.5px; color: var(--muted)">{{n.meta}}</span>
                  <sc-if value="{{n.action}}" hint-placeholder-val="{{ false }}">
                    <span style="align-self: flex-start; margin-top: 4px; font-size: 11.5px; font-weight: 700; color: var(--link); border: 1px solid var(--border-strong); border-radius: 7px; padding: 2px 8px">{{n.action}}</span>
                  </sc-if>
                </span>
                <sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}">
                  <span aria-label="خوانده نشده" style="width: 8px; height: 8px; border-radius: 50%; background: #2F6FED; margin-top: 6px; flex-shrink: 0"></span>
                </sc-if>
              </a>
            </sc-for>
          </div>
          <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 42px; border-top: 1px solid var(--border-soft); font-size: 12.5px; font-weight: 700">همه اعلان‌ها</a>
        </div>
      </sc-if>
      </div>
    </div>
  </header>

  <div class="wrap list-page" style="max-width: 1400px; margin: 0 auto; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; height: calc(100vh - 53px); min-height: 800px">

  <sc-if value="{{notDetail}}" hint-placeholder-val="{{ true }}">
  <!-- Sub-navigation + page actions -->
  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
    <nav aria-label="بخش‌های فروش" style="display: flex; gap: 2px; background: var(--surface-3); border-radius: 10px; padding: 3px; overflow-x: auto; max-width: 100%">
      <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 700; box-shadow: 0 1px 3px rgba(11,21,48,.14); white-space: nowrap"><span class="ms" style="font-size: 16px">receipt_long</span>بل‌های فروش</a>
      <a href="VisitorReport.html" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap"><span class="ms" style="font-size: 16px">badge</span>گزارش ویزیتورها</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
      <div style="position: relative">
        <button onClick="{{toggleDl}}" aria-expanded="{{dlExpanded}}" class="btn" style="display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink); cursor: pointer">
          <span class="ms" style="font-size: 18px; color: var(--muted)">download</span><span class="hide-sm">دانلود</span><span class="ms" style="font-size: 16px; color: var(--muted)">expand_more</span>
        </button>
        <sc-if value="{{dlOpen}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: 40px; inset-inline-end: 0; z-index: 20; min-width: 170px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 24px 48px -16px rgba(11,21,48,.35); padding: 4px">
            <button type="button" onClick="{{dlExcel}}" class="row dl-it" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--text); font-size: 12.5px"><span class="ms" style="font-size: 18px; color: var(--ok-text)">table_view</span>Excel</button>
            <button type="button" onClick="{{dlPdf}}" class="row dl-it" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--text); font-size: 12.5px"><span class="ms" style="font-size: 18px; color: var(--danger-text)">picture_as_pdf</span>PDF</button>
            <button type="button" onClick="{{dlPrint}}" class="row dl-it" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: 8px; color: var(--text); font-size: 12.5px"><span class="ms" style="font-size: 18px; color: var(--muted)">print</span>چاپ فهرست</button>
          </div>
        </sc-if>
      </div>
      <a href="#" onClick="{{blankBill}}" class="btn" style="display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px; font-weight: 600; color: var(--ink)"><span class="ms" style="font-size: 18px; color: var(--muted)">note_add</span>بل خالی</a>
      <a href="SaleNew.html" class="btnp" style="display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 14px; background: #2F6FED; border-radius: 10px; font-size: 12.5px; font-weight: 700; color: #FFFFFF; box-shadow: 0 8px 18px -8px rgba(47,111,237,.9)"><span class="ms" style="font-size: 18px">add</span>فروش جدید</a>
    </div>
  </div>

  <!-- KPI cards (same anatomy as dashboard; follow the filters) -->
  <section aria-label="خلاصه فروش" class="kpi" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
      <article class="kcard" data-hero="{{k.hero}}" title="{{k.full}}">
        <span class="ktile" style="{{k.tile}}"><span class="ms f" style="font-size: 16px">{{k.icon}}</span></span>
        <div class="kbody">
          <span class="klabel">{{k.label}}</span>
          <span class="krow"><span class="kval" dir="ltr" style="{{k.valStyle}}">{{k.value}}</span><span class="kunit">{{k.unit}}</span></span>
          <span class="ksub">{{k.sub}}</span>
        </div>
        <div class="kside">
          <sc-if value="{{k.chip}}" hint-placeholder-val="{{ false }}"><span dir="ltr" class="kchip" style="{{k.chipStyle}}">{{k.chip}}</span></sc-if>
          <sc-if value="{{k.spark}}" hint-placeholder-val="{{ false }}">
            <svg width="56" height="20" viewBox="0 0 120 36" preserveAspectRatio="none" aria-hidden="true"><polyline points="{{k.spark}}" fill="none" style="{{k.sparkStyle}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
          </sc-if>
          <sc-if value="{{k.bar}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" class="kbar"><span style="{{k.bar}}"></span></span>
          </sc-if>
        </div>
      </article>
    </sc-for>
  </section>

  <!-- One card: toolbar, scrolling table, pagination -->
  <section aria-label="فهرست بل‌ها" class="list-card" style="flex: 1 1 auto; min-height: 620px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 1px 2px rgba(11,21,48,.04), 0 4px 14px -8px rgba(11,21,48,.10)">
    <!-- toolbar: search, then period + filter in one control -->
    <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border-soft)">
      <div style="display: flex; align-items: center; gap: 6px; flex: 1 1 280px; max-width: 440px; min-width: 0">
        <label style="display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; height: 36px; flex: 1; min-width: 0; box-sizing: border-box; color: var(--subtle)">
          <span class="ms" style="font-size: 18px">search</span>
          <input type="search" placeholder="شماره بل یا مشتری…" aria-label="جستجو در بل‌ها" onInput="{{onSearch}}" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--ink); flex: 1; min-width: 0">
        </label>
      </div>
      <div role="group" aria-label="بازه" style="display: flex; flex-wrap: wrap; gap: 2px; background: var(--surface-3); border-radius: 9px; padding: 3px">
        <sc-for list="{{dateOpts}}" as="o" hint-placeholder-count="4">
          <button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}}</button>
        </sc-for>
        <div style="position: relative; display: flex">
          <button onClick="{{toggleFilter}}" aria-label="فیلتر" title="فیلتر" aria-expanded="{{filterExpanded}}" aria-haspopup="dialog" style="{{filterBtnStyle}}">
            <span class="ms" style="font-size: 17px">tune</span>
            <sc-if value="{{hasActive}}" hint-placeholder-val="{{ false }}"><span style="min-width: 15px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #2F6FED; color: #FFFFFF; font-size: 9.5px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center">{{activeCount}}</span></sc-if>
          </button>
          <sc-if value="{{filterOpen}}" hint-placeholder-val="{{ false }}">
            <div onClick="{{closeFilter}}" style="position: fixed; inset: 0; z-index: 30"></div>
            <div role="dialog" aria-label="فیلتر" class="fpop" style="position: absolute; top: 36px; inset-inline-end: -3px; z-index: 31; width: 252px; max-height: min(500px, 72vh); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; box-shadow: 0 16px 40px -14px rgba(11,21,48,.35), 0 2px 6px -2px rgba(11,21,48,.08)">
              <span aria-hidden="true" class="fpop-arrow" style="position: absolute; top: -5px; inset-inline-end: 13px; width: 8px; height: 8px; background: var(--surface); border-top: 1px solid var(--border); border-inline-start: 1px solid var(--border); transform: rotate(45deg)"></span>
              <div style="flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--border-soft)">

          </div>
          <div style="text-align: left; line-height: 1.25"><div style="font-size: 11px; color: #A9B6D6">مجموع</div><div dir="ltr" style="font-size: 22px; font-weight: 800; color: #FFFFFF">{{bv.kTotal}}</div></div>

          <div class="bd-mt" data-m="disc"><div><span class="bd-ml"><span class="ms">sell</span>تخفیف</span><b dir="ltr">{{bv.disc}}</b></div></div>
          <div class="bd-mt" data-m="exp"><div><span class="bd-ml"><span class="ms">local_shipping</span>مصارف</span><b dir="ltr">{{bv.exp}}</b></div></div>
          <div class="bd-money-pf bd-mt" data-m="pf"><div><span class="bd-ml"><span class="ms">trending_up</span>مفاد</span><b dir="ltr">{{bv.profitT}}</b></div></div>

        </div>

    <div class="bd-card" style="overflow: hidden">
      <div class="bd-scroll">
      <table class="bd-tbl bd-items">

              <td class="n" dir="ltr">{{it.buy}}</td>
              <td class="n" dir="ltr">{{it.sell}}</td>
              <td class="n"><span class="bd-q2"><b dir="ltr">{{it.qty}}</b>{{it.unit}}</span></td>

            </tr>
          </sc-for>
        </tbody>
      </table>
      </div>
    </div>

      <div class="bd-scrim" onClick="{{bv.closePanel}}" aria-hidden="true"></div>

          <span class="bd-sheet-ic"><span class="ms">{{bv.panelIc}}</span></span>
          <div class="bd-sheet-tt"><h2 id="bd-sh-t">{{bv.panelT}}</h2></div>
          <span style="flex: 1"></span>
          <button type="button" onClick="{{bv.closePanel}}" class="bd-ic" title="بستن" aria-label="بستن"><span class="ms" style="font-size: 18px">close</span></button>
        </div>
        <div class="bd-feed bd-sheet-b">
        <sc-if value="{{bv.isPay}}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{bv.pays}}" as="p" hint-placeholder-count="2">
            <div class="bd-fr" data-t="pay">
              <span class="bd-fi"><span class="ms">receipt</span></span>
              <div class="bd-fm"><b dir="ltr">{{p.no}}</b><span>{{p.note}}</span></div>
              <b class="bd-fa" dir="ltr">{{p.amt}}</b>
              <div class="bd-fmeta"><span class="bd-fx"><span class="ms">event</span>{{p.d}}</span><span class="bd-fx"><span class="ms">person</span>{{p.by}}</span><span class="bd-wh"><span class="ms">account_balance</span>{{p.box}}</span></div>
            </div>
          </sc-for>
          <sc-if value="{{bv.noPays}}" hint-placeholder-val="{{ false }}"><div class="bd-fe" data-t="pay"><span class="ms">receipt_long</span><b>پرداختی نیست</b><span>رسیدها پس از ثبت این‌جا دیده می‌شوند</span></div></sc-if>
        </sc-if>
        <sc-if value="{{bv.isRet}}" hint-placeholder-val="{{ false }}">
          <sc-for list="{{bv.rets}}" as="p" hint-placeholder-count="1">
            <div class="bd-fr" data-t="ret">
              <span class="bd-fi"><span class="ms">assignment_return</span></span>
              <div class="bd-fm"><b dir="ltr">{{p.no}}</b><span>{{p.why}}</span></div>
              <b class="bd-fa" dir="ltr">{{p.amt}}</b>
              <div class="bd-fmeta"><span class="bd-fx"><span class="ms">event</span>{{p.d}}</span><span class="bd-fx"><span class="ms">person</span>{{p.by}}</span><span class="bd-wh"><span class="ms">medication</span>{{p.items}}</span></div>
            </div>
          </sc-for>
          <sc-if value="{{bv.noRets}}" hint-placeholder-val="{{ true }}"><div class="bd-fe" data-t="ret"><span class="ms">assignment_return</span><b>برگشتی نیست</b><span>برای این بل هیچ برگشتی ثبت نشده است</span></div></sc-if>
        </sc-if>
        <sc-if value="{{bv.isLog}}" hint-placeholder-val="{{ false }}">
          <ol class="bd-tl">
            <sc-for list="{{bv.histV}}" as="h" hint-placeholder-count="3">
              <li data-tone="{{h.tone}}" data-last="{{h.last}}"><span class="bd-td"><span class="ms">{{h.ic}}</span></span><div><b>{{h.t}}</b><span>{{h.s}}</span></div></li>
            </sc-for>
          </ol>
        </sc-if>
        </div>
      </aside>
    </sc-if>
  </div>
  </sc-if>

  






































































































































































































  <!-- ============ PRINT: roll / A4 / A3 ============ -->
  <sc-if value="{{pv.open}}" hint-placeholder-val="{{ false }}">
    <div onClick="{{pv.close}}" class="sp-scrim"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="pv-t" class="sp-dlg sp-print-dlg" style="width: min(860px, calc(100vw - 32px))">
      <div style="display: flex; align-items: center; gap: 8px">
        <span class="ct-mini" data-c="blue" aria-hidden="true"><span class="ms f" style="font-size: 15px">print</span></span>
        <h2 id="pv-t" style="margin: 0; font-size: 14.5px; font-weight: 800; color: var(--ink)">چاپ <span dir="ltr">{{pv.no}}</span></h2>
        <span style="flex: 1"></span>
        <button type="button" onClick="{{pv.close}}" aria-label="بستن" class="sp-ic"><span class="ms" style="font-size: 18px">close</span></button>
      </div>
      <div class="sp-print-body">
        <div style="display: flex; flex-direction: column; gap: 8px; width: 210px; flex-shrink: 0">

          <sc-for list="{{pv.fmts}}" as="f" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="{{f.s}}"><span class="ms" style="font-size: 20px">{{f.ic}}</span><span style="display: flex; flex-direction: column; line-height: 1.3"><b style="font-size: 12.5px">{{f.t}}</b><span dir="ltr" style="font-size: 10.5px; opacity: .75; text-align: start">{{f.sz}}</span></span></button>

          <button type="button" onClick="{{pv.doPrint}}" class="sp-btn sp-pri" style="height: 38px"><span class="ms" style="font-size: 17px">print</span>چاپ {{pv.fmtT}}</button>
        </div>
        <div class="sp-preview">
          <div class="sp-sheet gs sb" data-f="{{pv.f}}" data-blank="{{pv.blank}}">
            <header class="sb-hd">
              <span class="sb-shape" aria-hidden="true"></span>
              <div class="sb-co">
                <span class="sb-logo" aria-hidden="true">ذ</span>
                <div class="sb-co-t">
                  <b class="sb-co-n">شرکت ذوالنون</b>
                  <span class="sb-co-s">دواخانه و توزیع ادویه</span>
                  <span class="sb-co-i"><span>جاده میوند، مارکیت صدیق، کابل</span></span>
                  <span class="sb-co-i"><span dir="ltr">0704 495 743</span><span dir="ltr">0799 120 450</span></span>
                </div>
              </div>
              <div class="sb-doc">
                <span class="sb-doc-l"><i></i>بل فروش</span>
                <b dir="ltr" class="sb-doc-n">{{pv.no}}</b>
                <div class="sb-doc-rr"><span class="sb-chip" data-s="{{pv.stChipK}}">{{pv.stT}}</span><span class="sb-chip">{{pv.ver}}</span><span class="sb-doc-r">مرجع <b dir="ltr">{{pv.ref}}</b></span></div>
                <div class="sb-dm">
                  <div><span><i>تاریخ</i><b>{{pv.d}}</b></span><span><i>ساعت</i><b dir="ltr">{{pv.time}}</b></span></div>
                  <div><span><i>تعداد اقلام</i><b dir="ltr">{{pv.nIt}}</b></span><span><i>مجموع تعداد</i><b dir="ltr">{{pv.tq}}</b></span></div>
                </div>
              </div>
            </header>
            <div class="sb-custline">
              <span><span class="ms">person</span><i>مشتری</i><b>{{pv.c}}</b></span>
              <span><span class="ms">call</span><i>شماره</i><b dir="ltr">{{pv.ph}}</b></span>
              <span class="sb-ca"><span class="ms">location_on</span><i>آدرس</i><b>{{pv.cAddr}}</b></span>
            </div>
            <div class="gs-card sb-items">
              <div class="sb-ih"><span>#</span><span>محصول</span><span>انقضاء / بچ</span><span>فی دانه</span><span>تعداد</span><span>مجموع</span></div>
              <sc-for list="{{pv.pl}}" as="it" hint-placeholder-count="3">
                <div class="sb-ir"><span class="sb-i">{{it.i}}</span><div class="sb-2"><b dir="ltr">{{it.n}}</b><span>{{it.c}}</span></div><div class="sb-2 sb-eb"><b dir="ltr">{{it.e}}</b><span dir="ltr">{{it.b}}</span></div><span class="sb-m" dir="ltr">{{it.p}}</span><span class="sb-q"><b dir="ltr">{{it.q}}</b> {{it.u}}</span><b class="sb-m" dir="ltr">{{it.t}}</b></div>
              </sc-for>
            </div>
            <div class="sb-end">
              <div class="sb-end-side">
                <div class="sb-end-f"><span>به حروف</span><b>{{pv.words}}</b></div>
                <div class="sb-end-f"><span>توضیحات</span><b>{{pv.note}}</b></div>
              </div>
              <div class="sb-end-tot">
                <div class="sb-r"><span>مجموع بل</span><b dir="ltr">{{pv.gross}}</b></div>
                <div class="sb-r"><span>تخفیف <i dir="ltr">{{pv.discPct}}</i></span><b dir="ltr">{{pv.disc}}</b></div>
                <div class="sb-r"><span>مصارف</span><b dir="ltr">{{pv.expA}}</b></div>
                <div class="sb-r sb-r-pay"><span>قابل پرداخت</span><b dir="ltr">{{pv.payable}}</b></div>
                <div class="sb-r"><span>رسید بل</span><b dir="ltr">{{pv.paidA}}</b></div>
                <sc-if value="{{pv.hasBal}}" hint-placeholder-val="{{ true }}">
                  <div class="sb-r sb-r-bal sb-r-sep" data-k="{{pv.prevK}}"><span>بیلانس قبلی <em>{{pv.prevTag}}</em></span><b dir="ltr">{{pv.prevBal}}</b></div>

                </sc-if>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

            <div class="gs-sign wh-sign"><div><i></i><span>مدیر گدام</span></div><div><i></i><span>تحویل‌گیرنده</span></div><div><i></i><span>کنترل</span></div></div>
            <div class="wh-foot"><span>چاپ توسط <b>{{gp.by}}</b> · {{gp.d}} · <span dir="ltr">{{gp.time}}</span></span><span dir="ltr">Zeno ERP</span></div>

  <!-- ============ SALES REPORT (PDF / print) ============ -->

        <h2 id="rp-t" style="margin: 0; font-size: 14.5px; font-weight: 800; color: var(--ink)">{{rp.title}}</h2>

                  <span class="sb-co-s">دواخانه و توزیع ادویه</span>
                  <span class="sb-co-i"><span>جاده میوند، مارکیت صدیق، کابل</span></span>
                  <span class="sb-co-i"><span dir="ltr">0704 495 743</span><span dir="ltr">0799 120 450</span></span>
                </div>
              </div>
              <div class="sb-doc">
                <span class="sb-doc-l"><i></i>گزارش فروش</span>

                  <div><span><i>تعداد بل</i><b dir="ltr">{{rp.n}}</b></span><span><i>چاپ توسط</i><b>hewad</b></span></div>

              <b dir="ltr" data-k="tot">{{rp.tot}}</b><b dir="ltr" data-k="rec">{{rp.rec}}<small>{{rp.recPct}}</small></b><b dir="ltr" data-k="rem">{{rp.rem}}<small>{{rp.remPct}}</small></b><b dir="ltr" data-k="pf">{{rp.pf}}<small>{{rp.pfPct}}</small></b>
            </div>
            <div class="gs-card sb-items rpt-tbl">
              <div class="sb-ih"><span>#</span><span>نمبر بل</span><span>اقلام</span><span>تاریخ فروش</span><span>مشتری</span><span>مجموع فروش</span><span>پرداخت شده</span><span>باقی مانده</span><span>وضعیت</span></div>
              <sc-for list="{{rp.rows}}" as="r" hint-placeholder-count="5">
                <div class="sb-ir"><span class="sb-i">{{r.i}}</span><div class="sb-2 rpt-nr"><b dir="ltr" class="rpt-no">{{r.no}}</b><span dir="ltr">{{r.ref}}</span></div><span class="rpt-ni"><b dir="ltr">{{r.ni}}</b></span><div class="sb-2 rpt-dt"><b>{{r.d}}</b><span dir="ltr">{{r.g}}</span></div><b class="rpt-c">{{r.c}}</b><b class="sb-m" dir="ltr">{{r.t}}</b><span class="sb-m" dir="ltr">{{r.p}}</span><b class="sb-m rpt-r" data-owed="{{r.owed}}" dir="ltr">{{r.r}}</b><span class="rpt-st" data-s="{{r.sk}}">{{r.st}}</span></div>

            </div>
          </div>
        </div>
      </div>

  <!-- ============ RECEIPT (رسید بل) — same anatomy as journal «سند جدید» ============ -->
  <sc-if value="{{rc.open}}" hint-placeholder-val="{{ false }}">
    <div onClick="{{rc.close}}" class="sp-scrim"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="rc-t" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 51; width: 520px; max-width: calc(100vw - 24px); display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; box-shadow: 0 30px 70px -20px rgba(11,21,48,.55); text-align: start">
      <div style="display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-bottom: 1px solid var(--border-soft)">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 9px; background: var(--ok-soft); color: var(--ok-text); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="ms f" style="font-size: 18px">receipt</span></span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35">
          <h2 id="rc-t" style="margin: 0; font-size: 13.5px; font-weight: 800; color: var(--ink)">رسید بل</h2>
          <span dir="auto" style="font-size: 11px; color: var(--muted)">{{rc.sub}}</span>
        </div>
        <button type="button" onClick="{{rc.close}}" aria-label="بستن" style="width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 18px">close</span></button>
      </div>
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span class="rc-lbl">حساب</span>
          <span class="rc-acc"><span class="rc-av" aria-hidden="true">{{rc.initial}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25"><span style="font-weight: 800; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{rc.c}}</span><span dir="auto" style="font-size: 10px; font-weight: 600; color: var(--muted)">{{rc.accSub}}</span></span><span style="font-size: 10.5px; font-weight: 700; color: var(--warn-text)">باقی <span dir="ltr">{{rc.rem}}</span> ؋</span></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="rc-amt" class="rc-lbl" style="display: flex; align-items: center; gap: 6px">مبلغ<span aria-hidden="true" style="color: var(--danger-text)">*</span><span style="flex: 1"></span>
            <sc-if value="{{rc.canSettle}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{rc.settle}}" style="height: 20px; padding: 0 7px; border: 0; border-radius: 6px; background: var(--primary-soft); color: var(--link); font: inherit; font-size: 10.5px; font-weight: 700; cursor: pointer">تسویه</button></sc-if>
          </label>
          <div class="np-box" style="{{rc.amtBox}}">
            <input id="rc-amt" type="text" inputmode="decimal" autocomplete="off" value="{{rc.amt}}" onInput="{{rc.onAmt}}" placeholder="0" style="flex: 1; width: 0; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 12px; font-family: Inter, sans-serif; font-size: 18px; font-weight: 800; color: var(--ink); direction: ltr; text-align: right">
            <span style="height: 30px; margin-inline-end: 8px; padding: 0 10px; border-radius: 7px; background: var(--surface-3); display: inline-flex; align-items: center; font-weight: 800; color: var(--text)">؋</span>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 124px; gap: 8px; align-items: start">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span class="rc-lbl">واریز به</span>
            <div style="position: relative; display: flex; gap: 6px">
              <span class="rc-ctr"><span class="ms" style="font-size: 16px">{{rc.boxIc}}</span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{rc.boxT}}</span></span>
              <button type="button" onClick="{{rc.togBox}}" aria-haspopup="listbox" aria-expanded="{{rc.boxExp}}" aria-label="انتخاب صندوق یا بانک" title="صندوق یا بانک دیگر" class="rc-sq"><span class="ms" style="font-size: 18px">account_balance_wallet</span></button>
              <sc-if value="{{rc.boxOpen}}" hint-placeholder-val="{{ false }}">
                <div onClick="{{rc.closeBox}}" style="position: fixed; inset: 0; z-index: 5"></div>
                <div role="listbox" aria-label="صندوق‌ها" style="position: absolute; top: 40px; inset-inline: 0; z-index: 6; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 16px 40px -14px rgba(11,21,48,.35); padding: 4px; display: flex; flex-direction: column; gap: 2px">
                  <sc-for list="{{rc.boxes}}" as="b" hint-placeholder-count="3"><button type="button" role="option" aria-selected="{{b.on}}" onClick="{{b.pick}}" style="{{b.s}}"><span class="ms" style="font-size: 17px; color: var(--link)">{{b.ic}}</span><span style="flex: 1; display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 12px; font-weight: 700; color: var(--ink)">{{b.t}}</span><span style="font-size: 10px; color: var(--muted)">{{b.sb}}</span></span></button></sc-for>
                </div>
              </sc-if>
            </div>
          </div>
          <label class="rc-lbl" style="display: flex; flex-direction: column; gap: 4px">تاریخ
            <span class="np-box rc-date"><input type="text" inputmode="numeric" value="{{rc.date}}" onInput="{{rc.onDate}}" aria-label="تاریخ" style="flex: 1; width: 0; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0 8px; font-family: Inter, sans-serif; font-size: 12px; font-weight: 700; color: var(--ink); direction: ltr; text-align: right"><span class="ms" style="font-size: 15px; color: var(--subtle); margin-inline-end: 7px">calendar_month</span></span>
          </label>
        </div>
        <label class="rc-lbl" style="display: flex; flex-direction: column; gap: 4px">توضیحات
          <textarea class="np-box" rows="2" onInput="{{rc.onNote}}" style="width: 100%; min-height: 52px; resize: vertical; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font: inherit; font-size: 12px; font-weight: 500; line-height: 1.7; color: var(--ink); box-sizing: border-box; outline: 0">{{rc.note}}</textarea>
        </label>
        <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border-soft)">
          <span style="display: flex; flex-direction: column; gap: 1px; font-size: 10.5px; color: var(--muted)">باقی فعلی<span><span dir="ltr" style="font-family: Inter, sans-serif; font-size: 15px; font-weight: 800; color: var(--warn-text)">{{rc.nowV}}</span> ؋</span></span>
          <span class="ms" style="font-size: 18px; color: var(--subtle)">arrow_back</span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 10.5px; color: var(--muted)">بعد از رسید<span><span dir="ltr" style="{{rc.aftS}}">{{rc.aftV}}</span> ؋ <span style="font-size: 10px">{{rc.aftL}}</span></span></span>
        </div>
        <sc-if value="{{rc.hasErr}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 10.5px; font-weight: 600; color: var(--danger-text)">{{rc.err}}</span></sc-if>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid var(--border-soft); background: var(--surface-2); border-radius: 0 0 14px 14px">
        <span dir="ltr" style="font-family: Inter, sans-serif; font-size: 11px; font-weight: 700; color: var(--muted); margin-inline-end: auto">{{rc.rvNo}}</span>
        <button type="button" onClick="{{rc.close}}" class="btn" style="height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">لغو</button>
        <button type="button" onClick="{{rc.savePrint}}" class="btn" style="height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer"><span class="ms" style="font-size: 16px">print</span>چاپ</button>
        <button type="button" onClick="{{rc.save}}" style="height: 32px; padding: 0 16px; display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 8px; background: #16A34A; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 800; cursor: pointer"><span class="ms" style="font-size: 16px">check</span>ثبت</button>
      </div>
    </div>
  </sc-if>

  <!-- ============ WHATSAPP ============ -->
  <sc-if value="{{wa.open}}" hint-placeholder-val="{{ false }}">
    <div onClick="{{wa.close}}" class="sp-scrim"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="wa-t" class="sp-dlg" style="width: min(640px, calc(100vw - 32px))">
      <div style="display: flex; align-items: center; gap: 8px">
        <span class="ct-mini" data-c="green" aria-hidden="true"><span class="ms f" style="font-size: 15px">chat</span></span>
        <div style="flex: 1; min-width: 0; line-height: 1.35">
          <h2 id="wa-t" style="margin: 0; font-size: 14.5px; font-weight: 800; color: var(--ink)">ارسال واتساپ</h2>
          <span style="font-size: 11px; color: var(--muted)">{{wa.c}} · <span dir="ltr">{{wa.no}}</span></span>
        </div>
        <button type="button" onClick="{{wa.close}}" aria-label="بستن" class="sp-ic"><span class="ms" style="font-size: 18px">close</span></button>
      </div>
      <div class="sp-wa">
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
          <label style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 11.5px; font-weight: 700; color: var(--text)">شماره واتساپ</span>
            <input type="text" value="{{wa.ph}}" onInput="{{wa.onPh}}" aria-label="شماره واتساپ" placeholder="07XX XXX XXX" style="height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; font-family: Inter, sans-serif; font-size: 13px; font-weight: 700; direction: ltr; text-align: right; color: var(--ink); background: var(--surface); outline: 0">
          </label>
          <sc-if value="{{wa.noPh}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; color: var(--warn-text)">این مشتری شماره ثبت‌شده ندارد</span></sc-if>
          <textarea onInput="{{wa.onMsg}}" aria-label="متن پیام" style="min-height: 150px; resize: vertical; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: 12px; line-height: 1.7; color: var(--ink); background: var(--surface); outline: 0">{{wa.msg}}</textarea>
          <button type="button" aria-pressed="{{wa.pdfOn}}" onClick="{{wa.togPdf}}" style="{{wa.pdfS}}"><span class="ms" style="font-size: 15px">picture_as_pdf</span>ضمیمه PDF بل</button>
        </div>
        <div style="border-radius: 14px; overflow: hidden; background: #EFE7DE; border: 1px solid var(--border-soft)">
          <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #075E54; color: #FFFFFF; font-size: 12px; font-weight: 700"><span class="ms f" style="font-size: 16px">account_circle</span>{{wa.c}}</div>
          <div style="padding: 12px 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end">
            <sc-if value="{{wa.pdf}}" hint-placeholder-val="{{ true }}"><div style="background: #D9FDD3; border-radius: 10px; padding: 7px 9px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #111B21"><span class="ms f" style="font-size: 20px; color: #D64545">picture_as_pdf</span><span dir="ltr">{{wa.no}}.pdf</span></div></sc-if>
            <div style="max-width: 100%; background: #D9FDD3; border-radius: 10px; border-start-end-radius: 2px; padding: 8px 10px 6px; font-size: 12px; line-height: 1.75; color: #111B21">
              <sc-for list="{{wa.lines}}" as="ln" hint-placeholder-count="4"><div style="white-space: pre-wrap; min-height: 1em">{{ln.t}}</div></sc-for>
            </div>
          </div>
        </div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end">
        <button type="button" onClick="{{wa.close}}" class="sp-btn">لغو</button>
        <button type="button" onClick="{{wa.send}}" class="sp-btn sp-wa-btn"><span class="ms" style="font-size: 16px">send</span>ارسال</button>
      </div>
    </div>
  </sc-if>

  <!-- ============ VOID (never delete) ============ -->
  <sc-if value="{{vd.open}}" hint-placeholder-val="{{ false }}">
    <div onClick="{{vd.close}}" class="sp-scrim"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="vd-t" class="sp-dlg" style="width: min(440px, calc(100vw - 32px))">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11.5px; font-weight: 700; color: var(--text)">دلیل ابطال</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{vd.whys}}" as="w" hint-placeholder-count="4"><button type="button" aria-pressed="{{w.on}}" onClick="{{w.pick}}" style="{{w.s}}">{{w.t}}</button></sc-for>
        </div>
        <sc-if value="{{vd.isOther}}" hint-placeholder-val="{{ false }}"><textarea onInput="{{vd.onNote}}" aria-label="دلیل" placeholder="دلیل را بنویسید" style="min-height: 52px; resize: vertical; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); outline: 0">{{vd.note}}</textarea></sc-if>
        <sc-if value="{{vd.hasErr}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 11px; font-weight: 700; color: var(--danger-text)">{{vd.err}}</span></sc-if>

      <div style="display: flex; gap: 8px; justify-content: flex-end">

      </div>
    </div>
